<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TWILIGHT UI 화면 비교</title><style>
*{box-sizing:border-box}body{margin:0;background:#141310;color:#eee5d6;font:16px/1.6 system-ui,sans-serif;padding:24px}main{max-width:1700px;margin:auto}h1{font-size:26px;margin:0}p{max-width:1000px;color:#c7beae}select,button{font:inherit;background:#27231c;color:#efdbab;border:1px solid #897650;padding:8px 14px}nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:20px 0}.columns{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}figure{margin:0}figcaption{padding:8px 0;color:#d9c493}img{width:100%;display:block}.stage{position:relative;aspect-ratio:16/9;background:#090909;overflow:hidden}.stage img{height:100%;object-fit:fill}.overlay{max-width:1280px;margin:24px auto}.overlay .stage img{position:absolute;inset:0}label{display:flex;gap:12px;align-items:center}input{width:250px}a{color:#e9cd90}@media(max-width:850px){.columns{grid-template-columns:1fr}}
</style><main><h1>TWILIGHT UI 화면 비교</h1><p>실행 화면과 공식 가이드의 구조를 비교합니다. 원문 이미지는 공식 CDN에서 불러옵니다. 가이드 갱신일은 이미지·클라이언트 버전과 다를 수 있습니다. 게임 값, 장비 상태, 월드와 삭제 정책 대상 영역은 동일성 비교에서 제외합니다.</p><nav><label>화면 <select id="screen"></select></label><label>겹침 기준 <select id="baseline"><option value="reference">공식 참조</option><option value="before">변경 전</option></select></label><label>구현 화면 불투명도 <input id="opacity" type="range" min="0" max="100" value="50"><output id="value">50%</output></label></nav><div class="columns"><figure><figcaption>변경 전 · main 49f5470</figcaption><div class="stage"><img id="before" alt="변경 전"></div></figure><figure><figcaption id="ref-caption">공식 참조</figcaption><div class="stage"><img id="reference" alt="공식 참조"></div></figure><figure><figcaption>변경 후 · 실제 OpenGL</figcaption><div class="stage"><img id="after" alt="변경 후"></div></figure></div><figure class="overlay"><figcaption>동일한 표시 영역에서 겹침 비교 · 공식 가이드의 안내 테두리도 포함</figcaption><div class="stage"><img id="base" alt="겹침 기준"><img id="top" alt="구현 화면"></div></figure><p><a href="REFERENCES.md">출처·좌표·버전 차이</a> · <a href="VALIDATION.md">실행 결과와 남은 실패</a> · <a id="source" href="" target="_blank" rel="noreferrer">공식 원문 이미지</a></p></main><script>
const screens=[{"title": "HUD", "before": "evidence/before/hud-1280x720.png", "after": "evidence/after/hud-1280x720.png", "reference": "https://imgfiles-cdn.plaync.com/file/LineageM/download/20220311030103-QQWgzaxlNVv5ltuK0NII0-v4", "date": "2022-02-03"}, {"title": "가방", "before": "evidence/before/inventory-1280x720.png", "after": "evidence/after/inventory-1280x720.png", "reference": "https://imgfiles-cdn.plaync.com/file/LineageM/download/20211230162304-0plO2MczjiEP4s8rSu5i0-v4", "date": "2021-12-30"}, {"title": "캐릭터", "before": "evidence/before/character-1280x720.png", "after": "evidence/after/character-1280x720.png", "reference": "https://imgfiles-cdn.plaync.com/file/LineageM/download/20220311023457-qmcEHEtPoOny215lnLM60-v4", "date": "2022-02-03"}, {"title": "스킬", "before": "evidence/before/skills-1280x720.png", "after": "evidence/after/skills-1280x720.png", "reference": "https://imgfiles-cdn.plaync.com/file/LineageM/download/20220114205431-JXWIdcC2PvRhB9TuSdQQ0-v4", "date": "2022-02-03"}, {"title": "변신", "before": "evidence/before/transform-1280x720.png", "after": "evidence/after/catalog-detail-변신-1280x720.png", "reference": "https://imgfiles-cdn.plaync.com/file/LineageM/download/20220310222718-NNpi4j9XBda0NbSDUCCz0-v4", "date": "2022-02-03"}, {"title": "상점", "before": "evidence/before/shop-1280x720.png", "after": "evidence/after/shop-1280x720.png", "reference": "https://imgfiles-cdn.plaync.com/file/LineageM/download/20220307212809-wUVtdn0DDuJn3VbM6nVN0-v4", "date": "2022-02-03"}];
const select=document.getElementById('screen'),opacity=document.getElementById('opacity'),baseline=document.getElementById('baseline');
screens.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.title;select.append(o)});
function update(){const x=screens[Number(select.value)];for(const id of ['before','reference','after'])document.getElementById(id).src=x[id];document.getElementById('base').src=x[baseline.value];document.getElementById('top').src=x.after;document.getElementById('top').style.opacity=Number(opacity.value)/100;document.getElementById('value').textContent=opacity.value+'%';document.getElementById('ref-caption').textContent='공식 참조 · 페이지 '+x.date;document.getElementById('source').href=x.reference}
select.onchange=update;baseline.onchange=update;opacity.oninput=update;update();
</script></html>
