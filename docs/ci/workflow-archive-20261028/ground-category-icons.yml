name: Ground Category Icons
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ground-category-icons.yml'
      - 'tools/ground_icons/**'
      - 'tools/test_project_support.py'
      - 'scripts/ui/ground_item_icons.gd'
      - 'scripts/ui/item_visual_resolver.gd'
      - 'scripts/loot/**'
      - 'data/ground_item_icons.json'
      - 'data/catalog_v19.json'
      - 'data/game_db_v17.json'
      - 'data/inven_inventory_icons.json'
      - 'data/visuals/runtime_manifest.json'
      - 'assets/ground_categories/**'
      - 'assets/original_items/**'
      - 'assets/l1j/verified/ground/**'
      - 'tests/ground_category_probe.gd'
      - 'tests/capture_ground_categories.gd'
      - 'tests/inven_inventory_icons_test.gd'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ground-category-icons.yml'
      - 'tools/ground_icons/**'
      - 'scripts/ui/ground_item_icons.gd'
      - 'scripts/ui/item_visual_resolver.gd'
      - 'scripts/loot/**'
      - 'data/ground_item_icons.json'
      - 'data/catalog_v19.json'
      - 'data/game_db_v17.json'
      - 'data/inven_inventory_icons.json'
      - 'assets/ground_categories/**'
      - 'tests/ground_category_probe.gd'
      - 'tests/capture_ground_categories.gd'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ground-category-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ground-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      # Restore only main-published compact import artefacts. PR never writes
      # back cached resources; full Godot validation still runs as normal.
      - name: Restore trusted-main PNG import shards
        uses: ./.github/actions/restore-godot-png-cache
      - name: Restore trusted compact Godot import cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .godot/imported/*.webp-*
            .godot/imported/*.svg-*
            .godot/imported/*.ttf-*
            .godot/imported/*.wav-*
            **/*.import
          key: twilight-godot-import-4.7.2-linux-compat-main-v2-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            twilight-godot-import-4.7.2-linux-compat-main-v2-
      - name: Validate committed source and transparent PNG hashes offline
        run: |
          python3 -m pip install Pillow==12.3.0
          python3 tools/ground_icons/build.py
      - name: Install repository-pinned renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          curl --fail --location --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -qo /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Verify Main floor art, inventory, names, grade effects and real pickup
        run: python3 tools/ground_icons/verify.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --output /tmp/ground-icons --import-timeout 1800
      - name: Verification does not modify game source or assets
        run: git diff --exit-code -- scripts data assets tools tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ground-category-validation-${{ github.sha }}
          path: |
            /tmp/ground-icons/*.json
            /tmp/ground-icons/*.log
            /tmp/ground-icons/after-captures/
          retention-days: 14
          if-no-files-found: error
