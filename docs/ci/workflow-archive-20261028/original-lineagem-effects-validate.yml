name: Twilight Original LineageM Catalog Options

on:
  push:
    branches: ['codex/original-lineagem-effects-*']
  workflow_dispatch:

jobs:
  original-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Godot parse/import
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR:|ERROR:" import.log; then exit 1; fi
      - name: Original verified option coverage
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/original_lineagem_effects_smoke_test.gd 2>&1 | tee original-options.log
          if grep -E "SCRIPT ERROR:|ERROR:|ORIGINAL_EFFECTS_FAIL|ORIGINAL_LINEAGEM_EFFECTS_FAILED" original-options.log; then exit 1; fi
          grep -q "ORIGINAL_LINEAGEM_EFFECTS_OK" original-options.log
      - name: Previous branch regression
        shell: bash
        run: |
          set -o pipefail
          for test in catalog_effects_smoke_test item_options_runtime_smoke_test speed_option_smoke_test passive_skill_smoke_test skill_mechanism_smoke_test skill_element_integration_smoke_test item_buff_description_smoke_test ground_drop_smoke_test; do
            ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://tests/${test}.gd" 2>&1 | tee "${test}.log"
            if grep -E "SCRIPT ERROR:|ERROR:|SMOKE_FAILED|SMOKE FAIL|GROUND_DROP_FAIL:|ELEMENT INTEGRATION FAIL:|ITEM_OPTIONS_FAIL:|CATALOG_EFFECTS_FAIL:" "${test}.log"; then exit 1; fi
            grep -q "_OK" "${test}.log"
          done
