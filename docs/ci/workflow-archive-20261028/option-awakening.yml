name: TWILIGHT option awakening

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/cards/option_awakening*.json'
      - 'scripts/cards/option_awakening*.gd'
      - 'scripts/animation/option_awakening_aura.gd'
      - 'scripts/ui/option_awakening*.gd'
      - 'scripts/ui/renewal_hud.gd'
      - 'scripts/ui/renewal_window.gd'
      - 'scripts/world.gd'
      - 'scripts/card_draw_fusion.gd'
      - 'scripts/collections/equipment_collection_runtime.gd'
      - 'tests/option_awakening*test.gd'
      - 'tools/test_project.py'
      - '.github/workflows/option-awakening.yml'
  workflow_dispatch:

# Manual audits stay independent; newer automatic revisions release old runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  option-awakening:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Only restore caches published by trusted main; no PR uploads.
      - name: Restore trusted pinned Godot engine
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: /tmp/Godot_v4.7.2-stable_linux.x86_64
          key: twilight-godot-4.7.2-stable-linux-x86_64-engine-v1
      - name: Install or verify Godot 4.7.2 and virtual OpenGL
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/Godot_v4.7.2-stable_linux.x86_64
          if ! { test -x "$GODOT" && "$GODOT" --version | grep -q '^4\.7\.2\.stable'; }; then
            rm -f "$GODOT"
            curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
            unzip -q /tmp/godot.zip -d /tmp
            chmod +x "$GODOT"
          fi
          "$GODOT" --version | grep -q '^4\.7\.2\.stable'
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
      - name: Restore trusted compact Godot import cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .godot/imported/*.webp-*
            .godot/imported/*.svg-*
            .godot/imported/*.ttf-*
            .godot/imported/*.wav-*
            **/*.import
          key: twilight-godot-import-4.7.2-linux-compat-main-v2-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            twilight-godot-import-4.7.2-linux-compat-main-v2-
      - name: Check tracked runtime resource integrity
        run: python3 tools/check_resource_integrity.py --root .
      - name: Run isolated awakening and card regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_project.py \
            --godot /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --logs option-awakening-results \
            --import-timeout 1800 \
            --no-ci-synthetic-fixtures \
            --only import,bake_navigation,boot,card_draw_fusion_test,card_pack_items_test,option_awakening_service_test,option_awakening_world_test,option_awakening_ui_test,option_awakening_vfx_test,option_awakening_field_render_test
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twilight-option-awakening-${{ github.sha }}
          path: option-awakening-results
          if-no-files-found: error
