name: TWILIGHT renewed-map spawn validation

on:
  pull_request:
    paths:
      - 'data/maps/**'
      - 'data/monsters/**'
      - 'data/game_db_v17.json'
      - 'scripts/maps/**'
      - 'scripts/monsters/**'
      - 'scripts/loot_drop.gd'
      - 'tests/*spawn*'
      - 'tests/monster_world_test.gd'
      - 'tools/test_project.py'
      - 'tools/test_project_support.py'
      - '.github/workflows/renewed-map-spawns.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renewed-map-spawns-refs/heads/${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  GODOT: /tmp/spawn-validation/Godot_v4.7.2-stable_linux.x86_64
  XDG_DATA_HOME: /tmp/spawn-validation/userdata

jobs:
  validate:
    runs-on: ubuntu-latest
    # PR #100: full regressions take ~70m; retain all tests and allow the later render stages.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore trusted-main PNG import shards
        uses: ./.github/actions/restore-godot-png-cache
      - name: Prepare evidence directory
        run: |
          mkdir -p /tmp/spawn-validation/test-results
          git rev-parse HEAD > /tmp/spawn-validation/test-results/source-sha.txt
      - name: Resource integrity preflight
        run: python3 tools/check_resource_integrity.py --root . 2>&1 | tee /tmp/spawn-validation/test-results/resource-integrity.log
      - name: Portable rule checks
        run: python3 -m unittest discover -s tests -p 'test_renewed_map_spawn_rules.py' -v 2>&1 | tee /tmp/spawn-validation/test-results/rules.log
      - name: Install project-pinned Godot
        run: |
          curl -L --fail --retry 3 -o /tmp/spawn-validation/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/spawn-validation/godot.zip -d /tmp/spawn-validation
          chmod +x "$GODOT"
          "$GODOT" --version | tee /tmp/spawn-validation/test-results/godot-version.txt
      - name: Install software OpenGL for frame-dependent regressions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
      - name: Import scripts and resources
        run: |
          set -o pipefail
          # After resource growth, the cold Godot import reached 96% at the former
          # 900s timeout (exit 124) on run 40222470650; no spawn test executed.
          # Keep a finite ceiling and the existing 120-minute job limit.
          timeout 1800s "$GODOT" --headless --import --path . 2>&1 | tee /tmp/spawn-validation/test-results/import.log
      - name: Validate all 25 current maps and export effective placements
        run: |
          timeout 600s "$GODOT" --headless --path . --script res://tests/renewed_map_spawn_test.gd -- --output /tmp/spawn-validation/test-results/renewed-map-spawns.json 2>&1 | tee /tmp/spawn-validation/test-results/terrain.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/spawn-validation/test-results')
          result = json.loads((root / 'renewed-map-spawns.json').read_text())
          assert len(result['maps']) == 25 and result['checks'] > 0
          assert result['failures'] == [], result['failures']
          for name in ['import.log', 'terrain.log']:
              text = (root / name).read_text()
              assert 'SCRIPT ERROR:' not in text and 'Parse Error:' not in text, name
          PY
      - name: Map population, routes and boss persistence regressions
        # Integration keeps the full suite on these PR bases; other events remain full.
        env:
          TWILIGHT_CI_TESTS: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'integration/twilight-complete-20261009') && 'import,bake_navigation,boot,native_png_route_recovery_test,renewed_map_spawn_test,remake_map_population_test,monster_world_test,aden_faith_png_monster_spawns_test,native_png_monster_spawns_test,aden_faith_png_save_migration_test,hunting_paths_test,hunting_navigation_cache_test,stage5_save_compatibility_test,remake_world_lifecycle_test,aden_boss_special_test,remake_source_runtime_test' || '' }}
        run: python3 tools/test_project.py --godot "$GODOT" --logs /tmp/spawn-validation/test-results/project --only "$TWILIGHT_CI_TESTS"
      - name: Publish validation evidence, not an untested game build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renewed-map-spawn-tests-${{ github.sha }}
          path: /tmp/spawn-validation/test-results
          retention-days: 14
          if-no-files-found: error
