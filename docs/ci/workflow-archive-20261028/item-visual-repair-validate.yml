name: Item Visual Repair Validate
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ui/item_visual*.gd'
      - 'scripts/ui/optional_item_icon_pack.gd'
      - 'data/optional_item_icons_15.json'
      - 'tools/install_optional_item_icons.py'
      - 'tests/item_optional_icons_test.gd'
      - 'assets/original_items/inventory/**'
      - 'scripts/ui/item_icon_foreground.gd'
      - 'assets/catalog/**'
      - 'data/catalog_v19.json'
      - 'tests/item_visual*_test.gd'
      - '.github/workflows/item-visual-repair-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: item-visual-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  restore-and-foreground:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Restore trusted-main PNG import shards
        uses: ./.github/actions/restore-godot-png-cache
      - name: Restore trusted compact Godot import cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .godot/imported/*.webp-*
            .godot/imported/*.svg-*
            .godot/imported/*.ttf-*
            .godot/imported/*.wav-*
            **/*.import
          key: twilight-godot-import-4.7.2-linux-compat-main-v2-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            twilight-godot-import-4.7.2-linux-compat-main-v2-
      - name: Verify original resource integrity
        run: python3 tools/check_resource_integrity.py --root .
      - name: Install repository-pinned Godot
        run: |
          curl -sS -L --fail --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and run link, alpha, identity and UI lifecycle regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          export XDG_CONFIG_HOME="$RUNNER_TEMP/item-repair-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/item-repair-cache"
          ENGINE=/tmp/Godot_v4.7.2-stable_linux.x86_64
          timeout --signal=TERM --kill-after=15s 1800s "$ENGINE" --headless --path . --import > test-results/import.txt 2>&1
          if grep -E 'SCRIPT ERROR:|ERROR:' test-results/import.txt; then exit 1; fi
          for name in item_visual_repair_test item_visual_test item_icon_art_smoke_test item_optional_icons_test; do
            export XDG_DATA_HOME="$RUNNER_TEMP/item-repair-$name"
            timeout 180 "$ENGINE" --headless --path . --script "res://tests/$name.gd" > "test-results/$name.txt" 2>&1
            if grep -E 'SCRIPT ERROR:|ERROR:|FAIL:|_FAILED' "test-results/$name.txt"; then exit 1; fi
            grep -q '_OK' "test-results/$name.txt"
          done
          git diff --exit-code -- assets data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-visual-repair-${{ github.sha }}
          path: test-results/
          if-no-files-found: error
