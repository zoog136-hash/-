name: setup-godot-linux
description: Restore pinned Godot 4.7.2 executable from trusted main cache or install from official release
runs:
  using: composite
  steps:
    - name: Restore pinned Godot from default-branch cache
      id: engine-cache
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: /tmp/Godot_v4.7.2-stable_linux.x86_64
        key: twilight-godot-4.7.2-stable-linux-x86_64-engine-v1
    - shell: bash
      run: |
        if ! { test -x /tmp/Godot_v4.7.2-stable_linux.x86_64 && /tmp/Godot_v4.7.2-stable_linux.x86_64 --version | grep -q '^4\.7\.2\.stable'; }; then
          rm -f /tmp/Godot_v4.7.2-stable_linux.x86_64
          curl -L --fail --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
        fi
        /tmp/Godot_v4.7.2-stable_linux.x86_64 --version | grep -q '^4\.7\.2\.stable'
    - name: Save verified Godot on trusted main push
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.engine-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: /tmp/Godot_v4.7.2-stable_linux.x86_64
        key: twilight-godot-4.7.2-stable-linux-x86_64-engine-v1
