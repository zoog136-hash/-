name: Godot Validate

on:
  push:
    branches: [main, 'codex/world-regions-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package project source
        uses: actions/upload-artifact@v4
        with:
          name: twilight-godot-main-${{ github.sha }}
          path: |
            .gitignore
            Main.tscn
            README_KO.md
            V19*.txt
            V20*.txt
            project.godot
            assets
            data
            legacy
            scenes
            scripts
            tests
            tools
            docs
          if-no-files-found: error
          compression-level: 6

      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee godot-parse.log
          if grep -E "SCRIPT ERROR:|ERROR:" godot-parse.log; then
            echo "Godot import/parse reported an error."
            exit 1
          fi

      - name: Boot main scene
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 30 2>&1 | tee godot-boot.log
          if grep -E "SCRIPT ERROR:|ERROR:" godot-boot.log; then
            echo "Godot boot reported an error."
            exit 1
          fi

      - name: Mythic job smoke test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/job_smoke_test.gd 2>&1 | tee godot-job-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|SMOKE FAIL:|JOB_SMOKE_FAILED" godot-job-smoke.log; then
            echo "Mythic job smoke test reported an error."
            exit 1
          fi
          grep -q "JOB_SMOKE_OK" godot-job-smoke.log

      - name: Quickslot SELF smoke test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/quickslot_smoke_test.gd 2>&1 | tee godot-quickslot-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|QUICKSLOT FAIL:|QUICKSLOT_SMOKE_FAILED" godot-quickslot-smoke.log; then
            echo "Quickslot SELF smoke test reported an error."
            exit 1
          fi
          grep -q "QUICKSLOT_SMOKE_OK" godot-quickslot-smoke.log

      - name: Speed option smoke test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/speed_option_smoke_test.gd 2>&1 | tee godot-speed-option-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|SPEED FAIL:|SPEED_OPTION_SMOKE_FAILED" godot-speed-option-smoke.log; then
            echo "Attack/move speed option smoke test reported an error."
            exit 1
          fi
          grep -q "SPEED_OPTION_SMOKE_OK" godot-speed-option-smoke.log

      - name: Weapon rules smoke test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/weapon_rules_smoke_test.gd 2>&1 | tee godot-weapon-rules-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|WEAPON RULE FAIL:|WEAPON_RULE_SMOKE_FAILED" godot-weapon-rules-smoke.log; then
            echo "Weapon rule smoke test reported an error."
            exit 1
          fi
          grep -q "WEAPON_RULE_SMOKE_OK" godot-weapon-rules-smoke.log

      - name: Shield compatibility smoke test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/shield_rules_smoke_test.gd 2>&1 | tee godot-shield-rules-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|SHIELD RULE FAIL:|SHIELD_RULE_SMOKE_FAILED" godot-shield-rules-smoke.log; then
            echo "Shield compatibility smoke test reported an error."
            exit 1
          fi
          grep -q "SHIELD_RULE_SMOKE_OK" godot-shield-rules-smoke.log

      - name: Equipment slot smoke test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/equipment_slot_smoke_test.gd 2>&1 | tee godot-equipment-slot-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|EQUIPMENT SLOT FAIL:|EQUIPMENT_SLOT_SMOKE_FAILED" godot-equipment-slot-smoke.log; then
            echo "Equipment slot smoke test reported an error."
            exit 1
          fi
          grep -q "EQUIPMENT_SLOT_SMOKE_OK" godot-equipment-slot-smoke.log

      - name: Item DB slot smoke test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/item_db_slot_smoke_test.gd 2>&1 | tee godot-item-db-slot-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|ITEM DB SLOT FAIL:|ITEM_DB_SLOT_SMOKE_FAILED" godot-item-db-slot-smoke.log; then
            echo "Item DB slot smoke test reported an error."
            exit 1
          fi
          grep -q "ITEM_DB_SLOT_SMOKE_OK" godot-item-db-slot-smoke.log

      - name: Inventory DB integration smoke test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/inventory_db_smoke_test.gd 2>&1 | tee godot-inventory-db-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|INVENTORY DB FAIL:|INVENTORY_DB_SMOKE_FAILED" godot-inventory-db-smoke.log; then
            echo "Inventory DB integration smoke test reported an error."
            exit 1
          fi
          grep -q "INVENTORY_DB_SMOKE_OK" godot-inventory-db-smoke.log

      - name: Item buff description smoke test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/item_buff_description_smoke_test.gd 2>&1 | tee godot-item-buff-smoke.log
          if grep -E "SCRIPT ERROR:|ITEM BUFF FAIL:|ITEM_BUFF_SMOKE_FAILED" godot-item-buff-smoke.log; then
            echo "Item buff description smoke test reported an error."
            exit 1
          fi
          grep -q "ITEM_BUFF_SMOKE_OK" godot-item-buff-smoke.log

      - name: Passive skill smoke test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/passive_skill_smoke_test.gd 2>&1 | tee godot-passive-skill-smoke.log
          if grep -E "SCRIPT ERROR:|PASSIVE SKILL FAIL:|PASSIVE_SKILL_SMOKE_FAILED" godot-passive-skill-smoke.log; then
            echo "Passive skill smoke test reported an error."
            exit 1
          fi
          grep -q "PASSIVE_SKILL_SMOKE_OK" godot-passive-skill-smoke.log

      - name: Mobile scroll smoke test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/mobile_scroll_smoke_test.gd 2>&1 | tee godot-mobile-scroll-smoke.log
          if grep -E "SCRIPT ERROR:|MOBILE SCROLL FAIL:|MOBILE_SCROLL_SMOKE_FAILED" godot-mobile-scroll-smoke.log; then
            echo "Mobile scroll smoke test reported an error."
            exit 1
          fi
          grep -q "MOBILE_SCROLL_SMOKE_OK" godot-mobile-scroll-smoke.log

      - name: Viewport touch and mouse routing
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/twilight-input-tests"
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/input_routing_test.gd 2>&1 | tee godot-input-routing.log
          if grep -E "SCRIPT ERROR:|ERROR:|INPUT FAIL:|INPUT_ROUTING_FAILED" godot-input-routing.log; then
            exit 1
          fi
          grep -q "INPUT_ROUTING_OK" godot-input-routing.log

      - name: Playable field world tests
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/twilight-field-tests"
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/field_world_test.gd 2>&1 | tee godot-field-world.log
          if grep -E "SCRIPT ERROR:|ERROR:|FIELD FAIL:|FIELD_WORLD_FAILED" godot-field-world.log; then
            exit 1
          fi
          grep -q "FIELD_WORLD_OK" godot-field-world.log

      - name: All playable world regions
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/twilight-region-tests"
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/world_regions_test.gd 2>&1 | tee godot-world-regions.log
          if grep -E "SCRIPT ERROR:|ERROR:|REGION FAIL:|WORLD_REGIONS_FAILED" godot-world-regions.log; then
            exit 1
          fi
          grep -q "WORLD_REGIONS_OK" godot-world-regions.log

      - name: Region portal chain and camera limits
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/twilight-portal-tests"
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/world_region_portals_test.gd 2>&1 | tee godot-region-portals.log
          if grep -E "SCRIPT ERROR:|ERROR:|PORTAL FAIL:|WORLD_REGION_PORTALS_FAILED" godot-region-portals.log; then
            exit 1
          fi
          grep -q "WORLD_REGION_PORTALS_OK" godot-region-portals.log

      - name: Install virtual GL display
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          fi

      - name: Render actual region gameplay
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/twilight-render"
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1280x720x24" ./Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path . --script res://tests/capture_regions.gd 2>&1 | tee godot-region-render.log
          if grep -E "SCRIPT ERROR:|ERROR:" godot-region-render.log; then
            exit 1
          fi
          grep -q "REGION_CAPTURE_DIRECTORY" godot-region-render.log

      - name: Upload gameplay renders and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twilight-world-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/twilight-render/**/world-regions-review/*.png
            ${{ runner.temp }}/twilight-render/**/world-regions-review/*.json
            godot-*.log
          if-no-files-found: error
