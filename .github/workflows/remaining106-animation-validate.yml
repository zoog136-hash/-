name: Remaining106 actual Main visual gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/actors/eight_direction/original_based/albino_iguana_monster_authored/**'
      - 'assets/actors/eight_direction/original_based/fear_agni_monster_authored_v2/**'
      - 'data/combat_animation_profiles.json'
      - 'tests/run_remaining106*'
      - 'tests/fixtures/remaining106_review_pair.json'
      - 'tests/fixtures/pr122_family*.json'
      - 'tests/pr122_family_reuse_main_review.gd'
      - 'tools/import_original_based_motion.py'
      - 'tools/original_based_pose_patch.py'
      - 'tests/test_original_based_pose_patch.py'
      - '.github/workflows/remaining106-animation-validate.yml'

permissions:
  contents: read

concurrency:
  group: remaining106-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-family-five:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned engine and software OpenGL
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          printf '%s  %s\n' cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4 /tmp/godot.zip | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
      - name: Verify source resources and import
        run: |
          set -euo pipefail
          mkdir -p test-results/source-family-five
          python3 tools/check_resource_integrity.py --root .
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import > test-results/source-family-five/import.log 2>&1
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tools/bake_hunting_navigation.gd > test-results/source-family-five/navigation.log 2>&1
          ! grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' test-results/source-family-five/import.log test-results/source-family-five/navigation.log
      - name: Actual Main six-case gameplay and five-case continuous native playback
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          ENGINE=/tmp/Godot_v4.7.2-stable_linux.x86_64
          export XDG_DATA_HOME="${RUNNER_TEMP}/family-gameplay"
          export XDG_CONFIG_HOME="${XDG_DATA_HOME}/config" XDG_CACHE_HOME="${XDG_DATA_HOME}/cache"
          export TWILIGHT_PR100_BATCH_ISOLATED=1
          export TWILIGHT_PR100_BATCH_CONFIG=res://tests/fixtures/pr122_family_reuse.json
          export TWILIGHT_PR100_BATCH_REPORT="$PWD/test-results/source-family-five/gameplay.json"
          export TWILIGHT_PR100_BATCH_CAPTURE_DIR="$PWD/test-results/source-family-five/gameplay-captures"
          timeout 1500 xvfb-run -a -s '-screen 0 1280x720x24' "$ENGINE" --path . --rendering-driver opengl3 --audio-driver Dummy --script res://tests/pr122_family_reuse_main_review.gd > test-results/source-family-five/gameplay.log 2>&1
          export XDG_DATA_HOME="${RUNNER_TEMP}/family-temporal"
          export XDG_CONFIG_HOME="${XDG_DATA_HOME}/config" XDG_CACHE_HOME="${XDG_DATA_HOME}/cache"
          export TWILIGHT_PR100_TEMPORAL_ISOLATED=1
          export TWILIGHT_PR100_TEMPORAL_CONFIG=res://tests/fixtures/pr122_family_temporal.json
          export TWILIGHT_PR100_TEMPORAL_REPORT="$PWD/test-results/source-family-five/temporal.json"
          export TWILIGHT_PR100_TEMPORAL_CAPTURE_DIR="$PWD/test-results/source-family-five/temporal-captures"
          timeout 1200 xvfb-run -a -s '-screen 0 1280x720x24' "$ENGINE" --path . --rendering-driver opengl3 --audio-driver Dummy --script res://tests/original_based_temporal_main_test.gd > test-results/source-family-five/temporal.log 2>&1
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from test_project_support import classify_result
          root=Path('test-results/source-family-five')
          for mode in ['gameplay','temporal']:
              assert classify_result(mode,0,(root/(mode+'.log')).read_text())==(True,False)
          gameplay=json.loads((root/'gameplay.json').read_text())
          temporal=json.loads((root/'temporal.json').read_text())
          assert gameplay['failures']==[] and len(gameplay['cases'])==6
          assert temporal['failures']==[] and len(temporal['cases'])==5 and temporal['rendered']
          assert sum(c['native_phases'] for c in temporal['cases'])==528
          assert all(c['rendered_native_phases']==c['native_phases'] for c in temporal['cases'])
          PY
      - name: Preserve project-source Main evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-family-five-Main-${{ github.sha }}
          path: test-results/source-family-five/
          if-no-files-found: error
  actual-main-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned engine and software OpenGL
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          printf '%s  %s\n' cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4 /tmp/godot.zip | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
          python3 -m pip install 'Pillow==11.3.0' 'numpy==2.2.6' 'scipy==1.15.3'
      - name: Preserve resource and importer guards
        run: |
          set -euo pipefail
          python3 tools/check_resource_integrity.py --root .
          python3 tests/original_based_motion_import_test.py
          python3 tests/test_original_based_pose_files.py
          python3 tests/test_original_based_direction_canvases.py
          python3 tests/test_original_based_pose_patch.py
          python3 tools/test_project_runner_test.py
      - name: Actual Main headless, OpenGL, continuous native frames and baseline
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          ENGINE=/tmp/Godot_v4.7.2-stable_linux.x86_64
          export TWILIGHT_PR100_BATCH_ISOLATED=1
          export TWILIGHT_PR100_BATCH_CONFIG=res://tests/fixtures/remaining106_review_pair.json
          mkdir -p test-results/remaining106
          for mode in import headless actual temporal comparison transform; do
            export XDG_DATA_HOME="${RUNNER_TEMP}/remaining106-${mode}"
            export XDG_CONFIG_HOME="${XDG_DATA_HOME}/config"
            export XDG_CACHE_HOME="${XDG_DATA_HOME}/cache"
            export APPDATA="$XDG_DATA_HOME" LOCALAPPDATA="$XDG_DATA_HOME"
            case "$mode" in
              import) "$ENGINE" --headless --path . --import > test-results/remaining106/import.log 2>&1 ;;
              headless)
                export TWILIGHT_PR100_BATCH_REPORT="$PWD/test-results/remaining106/headless.json"
                timeout 1200 "$ENGINE" --headless --path . --script res://tests/run_original_based_batch.gd > test-results/remaining106/headless.log 2>&1 ;;
              actual)
                export TWILIGHT_PR100_BATCH_REPORT="$PWD/test-results/remaining106/actual.json"
                export TWILIGHT_PR100_BATCH_CAPTURE_DIR="$PWD/test-results/remaining106/actual-captures"
                timeout 1500 xvfb-run -a -s '-screen 0 1280x720x24' "$ENGINE" --path . --rendering-driver opengl3 --audio-driver Dummy --script res://tests/run_remaining106_visual_review.gd > test-results/remaining106/actual.log 2>&1 ;;
              temporal)
                export TWILIGHT_PR100_TEMPORAL_ISOLATED=1
                export TWILIGHT_PR100_TEMPORAL_CONFIG="$TWILIGHT_PR100_BATCH_CONFIG"
                export TWILIGHT_PR100_TEMPORAL_REPORT="$PWD/test-results/remaining106/temporal.json"
                export TWILIGHT_PR100_TEMPORAL_CAPTURE_DIR="$PWD/test-results/remaining106/temporal-captures"
                timeout 1200 xvfb-run -a -s '-screen 0 1280x720x24' "$ENGINE" --path . --rendering-driver opengl3 --audio-driver Dummy --script res://tests/original_based_temporal_main_test.gd > test-results/remaining106/temporal.log 2>&1 ;;
              comparison)
                export TWILIGHT_PR100_REPORT="$PWD/test-results/remaining106/comparison.json"
                export TWILIGHT_PR100_CAPTURE_DIR="$PWD/test-results/remaining106/comparison-captures"
                timeout 600 xvfb-run -a -s '-screen 0 1280x720x24' "$ENGINE" --path . --rendering-driver opengl3 --audio-driver Dummy --script res://tests/run_remaining106_style_compare.gd > test-results/remaining106/comparison.log 2>&1 ;;
              transform)
                export TWILIGHT_PR100_BATCH_CONFIG=res://tests/fixtures/pr100_transform_batch31.json
                export TWILIGHT_PR100_BATCH_REPORT="$PWD/test-results/remaining106/transform.json"
                export TWILIGHT_PR100_BATCH_CAPTURE_DIR="$PWD/test-results/remaining106/transform-captures"
                timeout 1500 xvfb-run -a -s '-screen 0 1280x720x24' "$ENGINE" --path . --rendering-driver opengl3 --audio-driver Dummy --script res://tests/run_remaining106_transform_visual_review.gd > test-results/remaining106/transform.log 2>&1 ;;
            esac
            python3 - "$mode" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from test_project_support import classify_result
          mode=sys.argv[1]
          assert classify_result('import' if mode=='import' else mode,0,Path(f'test-results/remaining106/{mode}.log').read_text()) == (True,False), mode
          PY
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('test-results/remaining106')
          for name in ['headless','actual','temporal']:
              d=json.loads((root/(name+'.json')).read_text())
              assert d['failures']==[] and len(d['cases'])==2 and d['checks']>0
          d=json.loads((root/'temporal.json').read_text())
          assert [c['native_phases'] for c in d['cases']]==[112,104]
          assert [c['rendered_native_phases'] for c in d['cases']]==[112,104]
          d=json.loads((root/'comparison.json').read_text())
          assert d['failures']==[] and len(d['comparisons'])==2
          d=json.loads((root/'transform.json').read_text())
          assert d['failures']==[] and len(d['cases'])==1 and d['checks']>0
          case=json.loads(Path(d['cases'][0]['report']).read_text())
          events=case['remaining106_player_visual']['events']
          assert len([e for e in events if e['name'].endswith('-contact')])==8
          assert all(e['state']['frame']==1 and e['state']['animation'].startswith('attack_') for e in events if e['name'].endswith('-contact'))
          assert case['transform_temporal']['native_phases']==112
          assert case['transform_temporal']['rendered_native_phases']==112
          PY
      - name: Keep QA reports separately inspectable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining106-reports-${{ github.sha }}
          path: |
            test-results/remaining106/**/*.json
            test-results/remaining106/*.log
          if-no-files-found: warn
      - name: Preserve actual frames and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining106-actual-Main-${{ github.sha }}
          path: test-results/remaining106/
          if-no-files-found: error
