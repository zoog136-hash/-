name: Twilight Non-Skill Options Validation

on:
  push:
    branches: ['codex/non-skill-options-*']
  workflow_dispatch:

jobs:
  validate-options:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Parse and import
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR:|ERROR:" import.log; then exit 1; fi
      - name: Non-skill gameplay options
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/non_skill_options_smoke_test.gd 2>&1 | tee non-skill.log
          if grep -E "SCRIPT ERROR:|ERROR:|NON_SKILL_OPTION_FAIL:|NON_SKILL_OPTIONS_SMOKE_FAILED" non-skill.log; then exit 1; fi
          grep -q "NON_SKILL_OPTIONS_SMOKE_OK" non-skill.log
      - name: Regression
        shell: bash
        run: |
          set -o pipefail
          for test in hp_mp_unique_effects_smoke_test original_lineagem_effects_smoke_test catalog_effects_smoke_test item_options_runtime_smoke_test item_weight_smoke_test equipment_slot_smoke_test speed_option_smoke_test passive_skill_smoke_test skill_mechanism_smoke_test ground_drop_smoke_test lineage_inventory_ui_smoke_test lineage_side_ui_smoke_test; do
            ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://tests/${test}.gd" 2>&1 | tee "${test}.log"
            if grep -E "SCRIPT ERROR:|ERROR:|SMOKE_FAILED|SMOKE FAIL|GROUND_DROP_FAIL:|ITEM_OPTIONS_FAIL:|CATALOG_EFFECTS_FAIL:|ORIGINAL_EFFECTS_FAIL:|NON_SKILL_OPTION_FAIL:" "${test}.log"; then exit 1; fi
            grep -q "_OK" "${test}.log"
          done
