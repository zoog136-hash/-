name: Apply validated interaction repair
on:
  push:
    branches: ['feature/input-eight-fixes-20261014']
    paths: ['.github/workflows/interaction-workspace.yml', 'tools/interaction-transfer.part-*']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'zoog136-hash/-'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preserve and verify existing tracked resources
        run: python3 tools/check_resource_integrity.py --root .
      - name: Verify transport and stage the exact locally tested source patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/interaction-transfer.part-0{0,1,2,3} > /tmp/interaction.patch.xz
          echo '8baef7ae4757cad2d5b69e28df650fec874edec10e899076ac9a5655a21ca7a3  /tmp/interaction.patch.xz' | sha256sum -c -
          xz -dc /tmp/interaction.patch.xz | git apply --index -
          git rm tools/interaction-transfer.part-* .github/workflows/interaction-workspace.yml
          git diff --cached --check
          python3 -m py_compile tools/test_interactions.py
          python3 tools/check_resource_integrity.py --root .
      - name: Install exact Godot test engine
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Clean import, boot and native input regressions with isolated saves
        run: python3 tools/test_interactions.py --godot /tmp/Godot_v4.7.2-stable_linux.x86_64 --prepare --test eight_interactions_test --test ui_pointer_transfer_test --logs test-results/interaction-apply
      - name: Commit only the staged repair to its own feature branch
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/input-eight-fixes-20261014'
          remote_head="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat > test-results/interaction-apply/changed-files.txt
          git commit -m 'fix: implement eight native touch, drag, targeting and AUTO interactions'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > test-results/interaction-apply/delivered-commit.txt
      - name: Preserve repair validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-repair-apply-${{ github.sha }}
          path: test-results/interaction-apply/
          retention-days: 14
          if-no-files-found: warn
