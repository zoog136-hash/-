name: Oman 1F isolated sample
on:
  push:
    branches: ['sample/oman01-a3-remake-20261014']
    paths: ['.github/workflows/oman01-sample-20261014.yml','samples/oman01/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: oman01-sample-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oman01-sampling-workspace
          run-id: 38502318571
          github-token: ${{ github.token }}
          path: .workspace
      - name: Split sampling workspace into bounded transfers
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          p=pathlib.Path('.workspace/oman01-sampling-workspace.zip')
          with zipfile.ZipFile(p) as src:
              with zipfile.ZipFile('oman01-core.zip','w',zipfile.ZIP_DEFLATED,3) as dst:
                  for f in src.infolist():
                      if not f.filename.startswith('assets/'):
                          dst.writestr(f,src.read(f))
          with p.open('rb') as f:
              i=0
              while data:=f.read(64*1024*1024):
                  pathlib.Path('workspace-part-%02d.bin'%i).write_bytes(data)
                  i+=1
          print('CORE_BYTES',pathlib.Path('oman01-core.zip').stat().st_size,'PARTS',i)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oman01-core
          path: oman01-core.zip
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: oman01-workspace-part-00
          path: workspace-part-00.bin
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: oman01-workspace-part-01
          path: workspace-part-01.bin
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: oman01-workspace-part-02
          path: workspace-part-02.bin
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: oman01-workspace-part-03
          path: workspace-part-03.bin
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: oman01-workspace-part-04
          path: workspace-part-04.bin
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: oman01-workspace-part-05
          path: workspace-part-05.bin
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: oman01-workspace-part-06
          path: workspace-part-06.bin
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: oman01-workspace-part-07
          path: workspace-part-07.bin
          if-no-files-found: ignore
          retention-days: 3
