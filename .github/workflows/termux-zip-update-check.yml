name: Termux ZIP updater check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/android/termux_update_zip.py'
      - 'tests/test_termux_update_zip.py'
      - '.github/workflows/termux-zip-update-check.yml'
permissions:
  contents: read
# Manual audits stay independent; newer automatic revisions release old runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  updater-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/android
            tests/test_termux_update_zip.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python3 -m py_compile tools/android/termux_update_zip.py tests/test_termux_update_zip.py
      - name: ZIP updater safety regression
        run: python3 -m unittest discover -s tests -p 'test_termux_update_zip.py' -v
