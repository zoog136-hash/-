name: Twilight Complete Detailed Catalog

on:
  push:
    branches: ['codex/full-detail-catalog-options-*']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -fsSL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse scripts
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit > import.log 2>&1
          if grep -E "SCRIPT ERROR:|ERROR:" import.log; then exit 1; fi
      - name: Full original source catalog and runtime effects
        shell: bash
        run: |
          set -o pipefail
          timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/detailed_catalog_full_smoke_test.gd 2>&1 | tee detailed.log
          if grep -E "SCRIPT ERROR:|ERROR:|DETAIL_CATALOG_FAIL:|DETAIL_CATALOG_FULL_FAILED" detailed.log; then exit 1; fi
          grep -q "DETAIL_CATALOG_FULL_OK" detailed.log
      - name: Previous options and UI regressions
        shell: bash
        run: |
          set -o pipefail
          for test in catalog_effects_smoke_test original_lineagem_effects_smoke_test item_options_runtime_smoke_test non_skill_options_smoke_test item_buff_description_smoke_test item_weight_smoke_test equipment_slot_smoke_test hp_mp_unique_effects_smoke_test per_instance_enchantments_smoke_test consumable_smoke_test playtest_catalog_drag_test; do
            XDG_DATA_HOME="$RUNNER_TEMP/detail-catalog-${test}" timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://tests/${test}.gd" 2>&1 | tee "${test}.log"
            if grep -E "SCRIPT ERROR:|ERROR:|SMOKE_FAILED|SMOKE FAIL|TEST FAIL|CATALOG_EFFECTS_FAIL|CONSUMABLE FAIL:|ITEM_OPTIONS_FAIL:" "${test}.log"; then exit 1; fi
            grep -q "_OK" "${test}.log"
          done
