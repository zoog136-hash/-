name: TWILIGHT PR86 Selective Port Validate
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ui/navigation_memory.gd'
      - 'scripts/ui/renewal_hud.gd'
      - 'scripts/ui/renewal_window.gd'
      - 'tests/ui_navigation_preservation_test.gd'
      - '.github/workflows/pr86-selective-port-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr86-selective-${{ github.ref }}
  cancel-in-progress: true
jobs:
  navigation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Resource preflight
        run: python3 tools/check_resource_integrity.py --root .
      - name: Import and validate navigation, existing input and quickslots
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/pr86-navigation"
          GODOT=./Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --import 2>&1 | tee import.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' import.log
          for test in ui_navigation_preservation_test ui_pointer_transfer_test quickslot_smoke_test ui_renewal_integration_test; do
            "$GODOT" --headless --path . --script "res://tests/${test}.gd" 2>&1 | tee "${test}.log"
            ! grep -E 'SCRIPT ERROR:|ERROR:|UI_NAVIGATION FAIL:|UI_POINTER FAIL:|QUICKSLOT FAIL:|UI RENEWAL FAIL:' "${test}.log"
          done
          grep -q 'UI_NAVIGATION_OK' ui_navigation_preservation_test.log
          grep -q 'QUICKSLOT_SMOKE_OK' quickslot_smoke_test.log
          grep -q 'UI_RENEWAL_INTEGRATION_OK' ui_renewal_integration_test.log
          grep -q '"failures":\[\]' ui_pointer_transfer_test.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr86-selective-port-logs
          path: '*.log'
