name: GitHub map auto-load validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/maps/native_png_registry.gd'
      - 'scripts/maps/remake_registry.gd'
      - 'tests/github_update_autoload_maps_test.gd'
      - '.github/workflows/github-map-autoload.yml'
  workflow_dispatch:
permissions:
  contents: read
# Manual audits stay independent; newer automatic revisions release old runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  game-map-autoload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
      - name: Download Godot 4.7.2
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Validate included PNG and topology without optional private installations
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/github_update_autoload_maps_test.gd 2>&1 | tee /tmp/autoload.log
          ! grep -E 'SCRIPT ERROR:|GITHUB_MAP_AUTOLOAD_FAIL:|Parse Error:' /tmp/autoload.log
          grep -q 'GITHUB_MAP_AUTOLOAD_RESULT' /tmp/autoload.log
          grep -q '\"failures\":\[\]' /tmp/autoload.log
      - name: Upload short test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-map-autoload-${{ github.sha }}
          path: |
            /tmp/autoload.log
            /tmp/godot-import.log
          retention-days: 3
