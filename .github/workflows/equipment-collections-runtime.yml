name: Equipment Collections Runtime

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/collections/**'
      - 'scripts/world.gd'
      - 'scripts/ui/renewal_hud.gd'
      - 'data/collections/**'
      - 'tests/equipment_collection_*'
      - 'tools/*equipment_collection*'
      - '.github/workflows/equipment-collections-runtime.yml'

permissions:
  contents: read

jobs:
  native-collections:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify tracked resources and exact collection bindings
        run: |
          set -o pipefail
          python3 tools/check_resource_integrity.py --root . | tee collection-resource.log
          python3 tools/check_equipment_collection_data.py --report collection-results/bindings.json
      - name: Install pinned Godot and OpenGL
        run: |
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Test actual Main inventory, save, stats and native UI
        run: |
          set -o pipefail
          git rev-parse HEAD | tee collection-tested-sha.txt
          python3 tools/run_equipment_collection_checks.py --godot "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --logs collection-results | tee collection-checks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equipment-collections-${{ github.sha }}
          path: |
            collection-results/**
            collection-resource.log
            collection-tested-sha.txt
            collection-checks.log
          if-no-files-found: error
          retention-days: 7
