name: Original Skill Migration Validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
# Manual audits stay independent; newer automatic revisions release old runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  original-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.7.2 Compatibility
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Install software OpenGL display for visual regressions
        uses: ./.github/actions/setup-software-gl
      - name: Dated data and graph invariants
        run: python3 tools/validate_original_skills.py --report test-results/data-validation.json
      - name: Restore trusted Godot imported resources
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.number != 157 && github.event.pull_request.number != 158) }}
        id: trusted-import-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .godot/imported
            **/*.import
          key: twilight-godot-import-4.7.2-linux-compat-main-v1
      - name: Skill behavior and combat regressions
        # Every PR also runs Integration's unfiltered suite; other events keep it here.
        env:
          TWILIGHT_CI_TESTS: ${{ github.event_name == 'pull_request' && 'import,bake_navigation,boot,original_skill_audio_test,original_skill_catalog_runtime_test,original_skill_learning_conditions_test,original_skill_provenance_test,original_skill_reduction_test,original_skill_restore_guard_test,original_skill_status_coexistence_test,original_skill_summon_test,original_skill_system_test,original_skill_target_state_test,original_skill_warehouse_migration_test,passive_skill_smoke_test,skill_element_integration_smoke_test,skill_icon_asset_integrity_test,skill_mechanism_smoke_test,skill_private_icon_binding_test,source_spx_skill_effect_test,combat_timing_test,combat_timeline_lifecycle_test' || '' }}
        run: python3 tools/test_project.py --godot ./Godot_v4.7.2-stable_linux.x86_64 --logs test-results --only "$TWILIGHT_CI_TESTS"
      - name: Real OpenGL render
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_DATA_HOME: '${{ github.workspace }}/render-save'
        run: |
          set -o pipefail
          xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --path . --audio-driver Dummy --script res://tests/capture_original_skills.gd -- --legacy-aden-faith-layouts 2>&1 | tee test-results/original-render.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' test-results/original-render.log
          grep -q 'ORIGINAL_RENDER_OK' test-results/original-render.log
          grep -q 'ORIGINAL_GUARDIAN_RENDER_OK' test-results/original-render.log
          grep -q 'ORIGINAL_TURN_UNDEAD_RENDER_OK' test-results/original-render.log
      - name: Preserve test logs and actual rendered previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-skills-${{ github.sha }}
          path: |
            test-results
            docs/skills/previews/*.png
