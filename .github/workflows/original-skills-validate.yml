name: Original Skill Migration Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/original-lineagem-skill-complete-*']
  workflow_dispatch:
jobs:
  original-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.7.2 Compatibility
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Dated data and graph invariants
        run: python3 tools/validate_original_skills.py --report test-results/data-validation.json
      - name: All behavioral and regression suites
        run: python3 tools/test_project.py --godot ./Godot_v4.7.2-stable_linux.x86_64 --logs test-results
      - name: Real OpenGL render
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_DATA_HOME: '${{ github.workspace }}/render-save'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          set -o pipefail
          xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --path . --audio-driver Dummy --script res://tests/capture_original_skills.gd 2>&1 | tee test-results/original-render.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' test-results/original-render.log
          grep -q 'ORIGINAL_RENDER_OK' test-results/original-render.log
          grep -q 'ORIGINAL_GUARDIAN_RENDER_OK' test-results/original-render.log
      - name: Preserve test logs and actual rendered previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-skills-${{ github.sha }}
          path: |
            test-results
            docs/skills/previews/*.png
