name: Source SP2 compositor
on:
  pull_request:
    paths:
      - 'scripts/animation/original_source_preview.gd'
      - 'scripts/animation/source_sp2_compositor.gd'
      - 'shaders/source_sp2_rgb565.gdshader'
      - 'tests/source_sp2_compositor_test.gd'
      - '.github/workflows/source-sp2-compositor.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-sp2-compositor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pixels:
    name: Source SP2 RGB565 OpenGL pixels
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/animation/source_sp2_compositor.gd
            /shaders/source_sp2_rgb565.gdshader
            /tests/source_sp2_compositor_test.gd
      - name: Install pinned engine and software display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          curl -L --fail --retry 2 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
      - name: Render exact integer kernels and successive source layers
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          printf 'config_version=5\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > project.godot
          set -o pipefail
          xvfb-run -a "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --path . --audio-driver Dummy --rendering-method gl_compatibility --script tests/source_sp2_compositor_test.gd -- --render 2>&1 | tee source-sp2-render.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines = Path('source-sp2-render.txt').read_text().splitlines()
          assert not any('ERROR:' in line for line in lines), 'Godot/shader error in render log'
          results = [json.loads(line.split(' ', 1)[1]) for line in lines if line.startswith('SOURCE_SP2_COMPOSITOR ')]
          assert len(results) == 1 and results[0]['failures'] == [] and results[0]['render_checks'] >= 152, results
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-sp2-render-${{ github.sha }}
          path: source-sp2-render.txt
          if-no-files-found: warn
