name: Source SP2 compositor
on:
  pull_request:
    paths:
      - 'scripts/animation/original_source_preview.gd'
      - 'scripts/animation/source_sp2_compositor.gd'
      - 'shaders/source_sp2_rgb565.gdshader'
      - 'tests/source_sp2_compositor_test.gd'
      - 'tests/source_preview_copy_free_test.gd'
      - 'tests/lobby_spine_android_blend_test.gd'
      - 'scripts/characters/lobby_spine_mesh_player.gd'
      - 'scripts/ui/original_ui/source_blend.gd'
      - 'scripts/ui/original_ui/source_destination_copy.gd'
      - 'scripts/ui/original_ui/source_sprite_back_buffer.gd'
      - 'scripts/ui/original_ui/source_particle.gd'
      - 'scripts/ui/original_ui/source_panel.gd'
      - 'tests/source_ui_copy_policy_gl_test.gd'
      - 'tools/ci_core.py'
      - '.github/workflows/source-sp2-compositor.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-sp2-compositor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pixels:
    name: Source SP2 RGB565 OpenGL pixels
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            /docs/.gdignore
            !/assets/
            !/external_map_packs/
      - name: Install pinned engine and software display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          curl -L --fail --retry 2 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
      - name: Prepare production preview and mesh resource graph
        run: |
          python3 tools/ci_core.py --stage "$RUNNER_TEMP/pixel-project" --godot "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --logs pixel-results --prepare-only
          "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/pixel-project" --editor --import --quit > pixel-results/import.txt 2>&1
      - name: Render kernels and copy-free production paths
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          for test in source_sp2_compositor_test source_preview_copy_free_test lobby_spine_android_blend_test source_ui_copy_policy_gl_test; do
            xvfb-run -a "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --path "$RUNNER_TEMP/pixel-project" --audio-driver Dummy --rendering-method gl_compatibility --script "res://tests/$test.gd" -- --render 2>&1 | tee "pixel-results/$test.txt"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          checks = {
              'source_sp2_compositor_test': ('SOURCE_SP2_COMPOSITOR', 152, 'render_checks'),
              'source_preview_copy_free_test': ('SOURCE_PREVIEW_COPY_FREE_RESULT', 12, 'render_checks'),
              'lobby_spine_android_blend_test': ('LOBBY_SPINE_ANDROID_BLEND', 8, 'render_checks'),
              'source_ui_copy_policy_gl_test': ('SOURCE_UI_COPY_POLICY_GL_RESULT', 120, 'pixel_comparisons'),
          }
          for name, (marker, count, field) in checks.items():
              lines = Path('pixel-results', name + '.txt').read_text().splitlines()
              assert not any('ERROR:' in line for line in lines), (name, 'Godot/shader error')
              results = [json.loads(line.split(' ', 1)[1]) for line in lines if line.startswith(marker + ' ')]
              assert len(results) == 1 and results[0]['failures'] == [] and results[0][field] >= count, (name, results)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-sp2-render-${{ github.sha }}
          path: pixel-results
          if-no-files-found: warn
