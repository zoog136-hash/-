name: TWILIGHT NPC Teleport

on:
  push:
    branches:
      - feature/twilight-npc-teleport-20261010
  pull_request:
    branches:
      - feature/twilight-warehouse-persistent-instances-20261010
      - main
  workflow_dispatch:

jobs:
  npc-transit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.7.2
        run: |
          curl -L --fail --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Project import and parse
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee teleport-import.log
          ! grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' teleport-import.log
      - name: Teleport policy and 25 map data regression
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/npc_teleport_test.gd 2>&1 | tee teleport-test.log
          ! grep -E 'SCRIPT ERROR:|ERROR:|FAIL:' teleport-test.log
          grep -q NPC_TELEPORT_OK teleport-test.log
      - name: Warehouse and shop regression
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/warehouse_persistence_test.gd 2>&1 | tee -a teleport-test.log
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/shop_authority_test.gd 2>&1 | tee -a teleport-test.log
          grep -q WAREHOUSE_OK teleport-test.log
          grep -q SHOP_AUTHORITY_OK teleport-test.log
      - name: Preserve outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twilight-teleport-evidence
          path: |
            teleport-import.log
            teleport-test.log
