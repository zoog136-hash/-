name: TWILIGHT NPC Dialogue Branches

on:
  pull_request:
    branches:
      - feature/twilight-shop-buyback-20261010
      - main
  workflow_dispatch:

# Manual audits stay independent; newer automatic revisions release old runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  npc-dialogue:
    # Covered by the complete Shop Buyback superset on ordinary PRs.
    # Preserve independent manual and PR #157/#158 audits.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number == 157 || github.event.pull_request.number == 158 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        uses: ./.github/actions/setup-godot-linux
      - name: Restore trusted Godot imported resources
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.number != 157 && github.event.pull_request.number != 158) }}
        id: trusted-import-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .godot/imported/*.webp-*
            .godot/imported/*.svg-*
            .godot/imported/*.ttf-*
            .godot/imported/*.wav-*
            **/*.import
          key: twilight-godot-import-4.7.2-linux-compat-main-v2-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            twilight-godot-import-4.7.2-linux-compat-main-v2-
      - name: Import and parse entire project
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee dialogue-import.log
          ! grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' dialogue-import.log
      - name: Dialogue plus existing NPC service regressions
        run: |
          set -o pipefail
          for test in tests/npc_dialogue_branching_test.gd tests/npc_teleport_test.gd tests/local_crafting_test.gd tests/shop_buyback_test.gd tests/warehouse_persistence_test.gd; do
            /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$test" 2>&1 | tee -a dialogue-test.log
          done
          ! grep -E 'SCRIPT ERROR:|ERROR:|FAIL:' dialogue-test.log
          grep -q NPC_DIALOGUE_OK dialogue-test.log
      - name: Store evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twilight-npc-dialogue-evidence
          path: |
            dialogue-import.log
            dialogue-test.log
