name: Install V17 Final
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Stage Twilight V17 FINAL installer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and install final Godot project
        shell: bash
        run: |
          set -euo pipefail
          cat .installer/chunk0 .installer/chunk1 .installer/chunk2 .installer/chunk3 > /tmp/twilight_v17_final.b64
          base64 -d /tmp/twilight_v17_final.b64 > /tmp/twilight_v17_final.zip
          echo "c0550f8f665f75ae5b28ae84da04ea9a5264bce83c569ee955560ec6b5e45fbc  /tmp/twilight_v17_final.zip" | sha256sum -c -
          rm -rf /tmp/twilight_final
          mkdir -p /tmp/twilight_final
          unzip -q /tmp/twilight_v17_final.zip -d /tmp/twilight_final
          test -f /tmp/twilight_final/final_project/project.godot
          test -f /tmp/twilight_final/final_project/main.tscn
          test -f /tmp/twilight_final/final_project/scripts/main.gd
          test -f /tmp/twilight_final/final_project/data/maps_compact.json

          rm -rf scripts data
          rm -f project.godot main.tscn README.md .gitignore
          cp -a /tmp/twilight_final/final_project/. .

          rm -rf .installer
          rm -f .github/workflows/install_final.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Twilight V17 FINAL project"
          git push origin HEAD:main
