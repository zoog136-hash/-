name: Lineage M Exact Official Map References
on:
  push:
    branches: ['research/lineagem-public-intake-20261013']
    paths: ['.github/workflows/lineagem-public-intake.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Download exact publicly linked official map images
        run: |
          python - <<'PY'
          import hashlib,json,io,time
          from pathlib import Path
          from urllib.request import build_opener,Request,HTTPRedirectHandler
          from urllib.parse import urlparse
          from PIL import Image
          root=Path('lineagem_exact_maps');root.mkdir(exist_ok=True)
          base='https://st.ncjapan.co.jp/'
          rows=[
           ('eodin_chapel_regions.png','ncjapan/bip/data/image/20251212154257_f7c68.png','https://lineagem-jp.com/guide/dungeon_eodin'),
           ('forgotten_island_title.jpg','ncjapan/ncsoft/lm/official/guide/dungeon_forgottenIsland/title.jpg','https://lineagem-jp.com/guide/dungeon_forgottenIsland'),
           ('forgotten_island_golem_lab_01.png','ncjapan/bip/data/image/20210802144147_ab468.png','https://lineagem-jp.com/guide/dungeon_forgottenIsland'),
           ('forgotten_island_golem_lab_02.png','ncjapan/bip/data/image/20210802152959_b5cee.png','https://lineagem-jp.com/guide/dungeon_forgottenIsland'),
           ('pirate_island_title.jpg','ncjapan/ncsoft/lm/official/guide/dungeon_pirateIsland/title.jpg','https://lineagem-jp.com/guide/dungeon_pirateIsland'),
           ('classic_dream_island.png','ncjapan/bip/data/image/20221223175504_5e69e.png','https://lineagem-jp.com/news_detail?seqNo=22657'),
           ('escaros_overview.png','ncjapan/bip/data/image/20240315104615_13177.png','https://lineagem-jp.com/guide/Ezkaroze'),
           ('escaros_touchdown_regions.png','ncjapan/bip/data/image/20240315111019_b2899.png','https://lineagem-jp.com/guide/Ezkaroze'),
           ('tower_of_insolence_01.jpg','ncjapan/ncsoft/lm/official/guide/dungeon_arroganceTower/go001_001.jpg','https://lineagem-jp.com/guide/dungeon_TowerofInsolence'),
           ('tower_of_insolence_entry.jpg','ncjapan/ncsoft/lm/official/guide/dungeon_arroganceTower/go001_041_v2.jpg?2=','https://lineagem-jp.com/guide/dungeon_TowerofInsolence')]
          class Redirect(HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):
            p=urlparse(newurl)
            if p.scheme!='https' or p.hostname!='st.ncjapan.co.jp':raise ValueError('outside publisher host')
            return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=build_opener(Redirect());manifest=[]
          for name,path,page in rows:
           r={'file':name,'url':base+path,'source_page':page,'native_tilemap':False,'status':'failed'}
           try:
            with opener.open(Request(r['url'],headers={'User-Agent':'TWILIGHT-Public-Reference-Audit/1.0'}),timeout=10) as f:b=f.read(8*1024*1024+1)
            if len(b)>8*1024*1024:raise ValueError('size limit')
            with Image.open(io.BytesIO(b)) as im:im.load();r.update(width=im.width,height=im.height,format=im.format,frames=getattr(im,'n_frames',1))
            (root/name).write_bytes(b);r.update(status='downloaded',bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
           except Exception as e:r['error']=str(e)[:300]
           manifest.append(r);print(r,flush=True)
           (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lineagem-exact-map-references-20261013
          path: lineagem_exact_maps/
          retention-days: 1
          if-no-files-found: error
