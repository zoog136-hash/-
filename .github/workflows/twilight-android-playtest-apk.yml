name: TWILIGHT Android ARM64 APK Playtest

# Playtest build: on main pushes (publishes the update), when dispatched, or
# on a PR that changes the build itself.
on:
  # Every main build publishes the over-the-air update pack (and the APK when
  # it fits a release asset) to the public "playtest-latest" release.
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/twilight-android-playtest-apk.yml'
      - 'scripts/boot/actor_pack.gd'
      - 'scripts/boot/updater.gd'
      - 'tools/android/update_pack.py'
      - 'export_presets.cfg'
  workflow_dispatch:

permissions:
  contents: read

# Manual audits stay independent; newer automatic revisions release old runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    # Cold PNG import missed all four trusted-main shards; preserve full import/export/inspection.
    timeout-minutes: 330
    steps:
      - name: Checkout isolated validated playtest
        uses: actions/checkout@v4
      - name: Free runner disk space
        uses: ./.github/actions/free-runner-disk
      - name: Restore trusted-main PNG import shards
        uses: ./.github/actions/restore-godot-png-cache
      - name: Restore tracked import settings
        # The PNG cache restores every *.import from an older main; put tracked ones back.
        run: git -c core.quotePath=false ls-files -t -- '*.import' | sed -n 's/^H //p' | tr '\n' '\0' | xargs -0 -r git checkout --
      - name: Prove archived drafts are detached from exported gameplay
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tests/android_animation_export_scope_test.py
          python3 tests/android_runtime_reachability_test.py
          python3 tools/android_animation_export_scope.py --output build/android-validation/export-scope.json
          python3 tools/android_runtime_reachability.py --check --output build/android-validation/unreachable-revisions.json
      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VER=4.7.2-stable
          curl -fL --retry 4 -o /tmp/godot-linux.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VER}/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot-linux.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --version
          curl -fL --retry 4 -o /tmp/godot-templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VER}/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-export-unpack
          find /tmp/godot-export-unpack -maxdepth 2 -type f | head -n 12
          cp -a /tmp/godot-export-unpack/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
      - name: Set up Android SDK and Java
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-}" >> "$GITHUB_ENV"
          echo "JAVA_HOME=${JAVA_HOME:-}" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          # One fixed playtest key (tools/android/twilight-playtest.keystore):
          # every build installs over the previous one, keeping the installed
          # resource pack and saves. A new key per run forced an uninstall.
          test -s tools/android/twilight-playtest.keystore
          cat > /tmp/config-editor.gd <<'GDSCRIPT'
          extends SceneTree
          func _initialize() -> void:
              var settings = EditorInterface.get_editor_settings()
              settings.set_setting("export/android/android_sdk_path", OS.get_environment("ANDROID_HOME"))
              settings.set_setting("export/android/java_sdk_path", OS.get_environment("JAVA_HOME"))
              settings.save()
              print("ANDROID_EDITOR_SETTINGS_OK")
              quit()
          GDSCRIPT
          # The playtest key is public on purpose (like any Android debug key):
          # it only keeps the app's signature the same between builds.
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$GITHUB_WORKSPACE/tools/android/twilight-playtest.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=twilight" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=twilight-playtest" >> "$GITHUB_ENV"
      - name: Import Android game resources
        shell: bash
        run: |
          set -euo pipefail
          if timeout 10800 /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import > /tmp/import-android.txt 2>&1; then
            echo "ANDROID_IMPORT_DONE"
          else
            import_status=$?
            echo "IMPORT_FAILED exit_code=$import_status"
            if [[ "$import_status" -eq 124 ]]; then
              echo "::error::Godot cold-cache Android import exceeded its 180-minute limit"
            fi
            tail -n 100 /tmp/import-android.txt
            exit "$import_status"
          fi
      - name: Configure Android SDK in Godot editor settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path.home()/'.config/godot/editor_settings-4.tres'
          p.parent.mkdir(parents=True,exist_ok=True)
          data=p.read_text() if p.exists() else '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          if '[resource]' not in data:
              data+='\n[resource]\n'
          for key,value in [('export/android/android_sdk_path',os.environ['ANDROID_HOME']),('export/android/java_sdk_path',os.environ['JAVA_HOME'])]:
              entry=key+' = "'+value.replace('\\','/')+'"'
              reg=r'^'+re.escape(key)+r'\s*=.*$'
              if re.search(reg,data,re.M):
                  data=re.sub(reg,lambda _:entry,data,flags=re.M)
              else:
                  data+='\n'+entry+'\n'
          p.write_text(data)
          print('EDITOR_CONFIG_OK',p, 'bytes',p.stat().st_size)
          for line in data.splitlines():
              if line.startswith('export/android/'):print(line)
          PY
      - name: Build and inspect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          df -h . /tmp | sed 's/^/DISK_BEFORE_EXPORT /'
          # Android only installs an update whose version code is not lower.
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          run = int(os.environ["GITHUB_RUN_NUMBER"])
          name = f"523.{run}"
          p = Path("export_presets.cfg")
          text = re.sub(r"^version/code=.*$", f"version/code={run}", p.read_text(), flags=re.M)
          p.write_text(re.sub(r'^version/name=.*$', f'version/name="{name}"', text, flags=re.M))
          g = Path("project.godot")
          text = g.read_text()
          text = re.sub(r'^config/version=.*\n', '', text, flags=re.M)
          g.write_text(text.replace('[application]\n', f'[application]\nconfig/version="{name}"\n', 1))
          print("ANDROID_VERSION", run, name)
          PY
          # Build identity for scripts/boot/updater.gd (shipped in APK and pack).
          python3 tools/android/update_pack.py build-info --version-code "$GITHUB_RUN_NUMBER" --version-name "523.$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" --godot-version "$(/tmp/Godot_v4.7.2-stable_linux.x86_64 --version)"
          timeout 3600 /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/TWILIGHT_ANDROID_PLAYTEST.apk > /tmp/export-android.txt 2>&1 || { echo "EXPORT_FAILED"; tail -n 120 /tmp/export-android.txt; exit 1; }
          grep -F "SOURCE84_RAW_EXPORT files=" /tmp/export-android.txt || { echo "::error::Raw Source84 pack was not added to APK"; exit 1; }
          test -s build/TWILIGHT_ANDROID_PLAYTEST.apk
          unzip -tqq build/TWILIGHT_ANDROID_PLAYTEST.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging build/TWILIGHT_ANDROID_PLAYTEST.apk | head -n 16
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/TWILIGHT_ANDROID_PLAYTEST.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 build/TWILIGHT_ANDROID_PLAYTEST.apk > /tmp/alignment-android.txt
          echo "TWILIGHT_ANDROID_APK_BUILD_OK"
          ls -lh build/TWILIGHT_ANDROID_PLAYTEST.apk
      - name: Export actor art pack
        # Android cannot sign an APK over 4 GB; assets/actors ships beside it
        # and scripts/boot/actor_pack.gd mounts it before anything loads.
        shell: bash
        run: |
          set -euo pipefail
          timeout 3600 /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-pack "AndroidActorPack" build/twilight_actor_pack.pck > /tmp/export-actor-pack.txt 2>&1 || { echo "ACTOR_PACK_EXPORT_FAILED"; tail -n 80 /tmp/export-actor-pack.txt; exit 1; }
          test -s build/twilight_actor_pack.pck
          ls -lh build/twilight_actor_pack.pck
          if unzip -l build/TWILIGHT_ANDROID_PLAYTEST.apk | grep -q 'assets/actors/'; then echo "::error::APK still contains assets/actors"; exit 1; fi
      - name: Export over-the-air update pack
        # Code, scenes, data and small art; mounted over this APK's build line
        # by scripts/boot/updater.gd. Large art changes only with a new APK.
        shell: bash
        run: |
          set -euo pipefail
          timeout 3600 /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-pack "AndroidUpdatePack" build/twilight-update.pck > /tmp/export-update-pack.txt 2>&1 || { echo "UPDATE_PACK_EXPORT_FAILED"; tail -n 80 /tmp/export-update-pack.txt; exit 1; }
          if grep -F "SOURCE84_RAW_EXPORT files=" /tmp/export-update-pack.txt; then echo "::error::raw map bytes leaked into the update pack"; exit 1; fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/playtest-latest"
          apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/playtest-latest"
          if [ "$(stat -c %s build/TWILIGHT_ANDROID_PLAYTEST.apk)" -lt 2000000000 ]; then
            # Fits a release asset: players get a direct .apk link.
            cp build/TWILIGHT_ANDROID_PLAYTEST.apk build/TWILIGHT.apk
            apk_url="$base/TWILIGHT.apk"
          else
            echo "::notice::APK is over the 2 GB release asset limit; it stays a workflow artifact"
          fi
          python3 tools/android/update_pack.py feed --pack build/twilight-update.pck --base-url "$base" --apk-url "$apk_url" --output build/update.json
          ls -lh build/twilight-update.pck build/TWILIGHT.apk 2>/dev/null || true
      - name: Upload update pack
        uses: actions/upload-artifact@v4
        with:
          name: TWILIGHT_UPDATE_${{ github.sha }}
          path: |
            build/twilight-update.pck
            build/update.json
            build/TWILIGHT.apk
          if-no-files-found: error
          compression-level: 0
      - name: Upload signed Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TWILIGHT_ANDROID_APK_${{ github.sha }}
          path: build/TWILIGHT_ANDROID_PLAYTEST.apk
          if-no-files-found: error
          compression-level: 0
      - name: Upload actor art pack
        uses: actions/upload-artifact@v4
        with:
          name: TWILIGHT_ACTOR_PACK_${{ github.sha }}
          path: build/twilight_actor_pack.pck
          if-no-files-found: error
          compression-level: 0
      - name: Verify exported animation scope
        # Reported separately; a stale expectation must not hide the playtest APK.
        continue-on-error: true
        shell: bash
        run: python3 tools/verify_android_animation_export.py --apk build/TWILIGHT_ANDROID_PLAYTEST.apk --godot /tmp/Godot_v4.7.2-stable_linux.x86_64 --android-sdk "$ANDROID_HOME" --output build/android-validation
      - name: Annotate failure cause
        if: failure()
        run: python3 tools/ci_annotate_failure.py --title "Android APK" /tmp/import-android.txt /tmp/export-android.txt build/android-validation/*.txt build/android-validation/*.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWILIGHT_ANDROID_EXPORT_LOGS
          path: |
            /tmp/import-android.txt
            /tmp/export-android.txt
            /tmp/export-actor-pack.txt
            /tmp/export-update-pack.txt
            build/update.json
            /tmp/android-settings.txt
            /tmp/alignment-android.txt
            build/android-validation/
          if-no-files-found: ignore

  publish-update:
    # Only main builds reach players. The pack and APK hold public repository
    # content only; the private 523 resource pack is never uploaded.
    needs: build-android-apk
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: publish-playtest-latest
      cancel-in-progress: false
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: TWILIGHT_UPDATE_${{ github.sha }}
          path: build
      - name: Publish to playtest-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          file=$(python3 -c 'import json;print(json.load(open("build/update.json"))["file"])')
          mv build/twilight-update.pck "build/$file"
          gh release view playtest-latest >/dev/null 2>&1 || gh release create playtest-latest --prerelease --title "TWILIGHT playtest (latest main)" --notes "Automatic main build. The game downloads update packs from here; the 523 resource pack is not included." --target "$GITHUB_SHA"
          assets=("build/$file")
          if [ -f build/TWILIGHT.apk ]; then assets+=("build/TWILIGHT.apk"); fi
          # Pack first, feed last: a player never sees a feed whose pack is missing.
          gh release upload playtest-latest "${assets[@]}" --clobber
          gh release upload playtest-latest build/update.json --clobber
          for old in $(gh release view playtest-latest --json assets --jq '.assets[].name' | grep -E '^twilight-update-[0-9]+\.pck$' | grep -vx "$file" || true); do gh release delete-asset playtest-latest "$old" --yes; done
          gh release edit playtest-latest --target "$GITHUB_SHA" --notes "Automatic main build $(python3 -c 'import json;print(json.load(open("build/update.json"))["version_name"])') ($GITHUB_SHA). The 523 resource pack is not included."
          echo "PUBLISHED $file"
