name: Twilight Consumable Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/world.gd'
      - 'scripts/consumable_rules.gd'
      - 'scripts/consumable_service.gd'
      - 'scripts/equipment_blessing.gd'
      - 'scripts/ui/lineage_inventory_ui.gd'
      - 'scripts/ui/renewal_inventory.gd'
      - 'tests/equipment_blessing_smoke_test.gd'
      - 'tests/consumable_smoke_test.gd'
      - 'tests/per_instance_enchantments_smoke_test.gd'
      - 'scripts/hud.gd'
      - '.github/workflows/consumable-validate.yml'
  workflow_dispatch:

jobs:
  consumables:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Parse all scripts
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee consumable-parse.log
          if grep -E "SCRIPT ERROR:|ERROR:" consumable-parse.log; then exit 1; fi
      - name: Run consumables integration smoke
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/twilight-consumable-test"
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/consumable_smoke_test.gd 2>&1 | tee consumable-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|CONSUMABLE FAIL:|CONSUMABLE_SMOKE_FAILED" consumable-smoke.log; then exit 1; fi
          grep -q "CONSUMABLE_SMOKE_OK" consumable-smoke.log
      - name: Run per-instance enchantment regression
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/twilight-instance-enchants"
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/per_instance_enchantments_smoke_test.gd 2>&1 | tee per-instance-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|PER_INSTANCE_FAIL:|PER_INSTANCE_ENCHANTMENTS_FAILED" per-instance-smoke.log; then exit 1; fi
          grep -q "PER_INSTANCE_ENCHANTMENTS_OK" per-instance-smoke.log
      - name: Run equipment blessing regression
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/twilight-equipment-blessing"
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/equipment_blessing_smoke_test.gd 2>&1 | tee blessing-smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:|BLESSING FAIL:|EQUIPMENT_BLESSING_SMOKE_FAILED" blessing-smoke.log; then exit 1; fi
          grep -q "EQUIPMENT_BLESSING_SMOKE_OK" blessing-smoke.log
      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumable-test-logs-${{ github.sha }}
          path: |
            consumable-*.log
            per-instance-*.log
            blessing-*.log
          if-no-files-found: ignore
