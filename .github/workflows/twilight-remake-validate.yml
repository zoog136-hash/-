name: TWILIGHT Remake Regression

on:
  push:
    branches: [feature/twilight-remake-20261013]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  connected-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned engine and renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
          python -m pip install Pillow
          curl -fL --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Preserve resource and runner requirements
        run: |
          python tools/check_resource_integrity.py --root .
          python tools/test_project_runner_test.py
          python -m unittest discover -s tests -p test_remake_resource_audit.py -v
      - name: Import, boot, shared combat, maps, settings and items
        run: |
          mkdir -p remake-results
          xvfb-run -a -s '-screen 0 1280x720x24' python - <<'PY'
          import os, pathlib, sys, tempfile
          sys.path.insert(0, 'tools')
          from test_project_support import classify_result, run_isolated
          engine = '/tmp/Godot_v4.7.2-stable_linux.x86_64'
          cases = [('import', ['--headless', '--editor', '--import']), ('boot', ['--headless', '--quit-after', '60'])]
          for name in ['combat_timeline_lifecycle_test', 'remake_world_lifecycle_test', 'remake_map_inventory_test', 'remake_map_population_test', 'remake_map_readability_test', 'remake_ui_presentation_test', 'item_visual_test', 'item_rarity_render_test', 'ground_loot_system_test', 'per_instance_enchantments_smoke_test']:
              visual = 'RenderingServer.frame_post_draw' in pathlib.Path('tests', name + '.gd').read_text()
              cases.append((name, (['--rendering-driver', 'opengl3', '--audio-driver', 'Dummy'] if visual else ['--headless']) + ['--script', 'res://tests/' + name + '.gd']))
          for name, extra in cases:
              with tempfile.TemporaryDirectory(prefix='twilight-remake-') as data:
                  env = dict(os.environ, XDG_DATA_HOME=data, APPDATA=data, LOCALAPPDATA=data, LIBGL_ALWAYS_SOFTWARE='1')
                  result = run_isolated([engine, '--path', '.', *extra], env=env, timeout=900 if name == 'import' else 180)
                  log = result.stdout + result.stderr
                  pathlib.Path('remake-results', name + '.log').write_text(log)
                  passed, skipped = classify_result(name, result.returncode, log)
                  print(name, 'PASS' if passed and not skipped else 'FAILED', flush=True)
                  if not passed or skipped: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twilight-remake-regression
          path: remake-results

  aden-main-screen:
    if: github.head_ref == 'feature/aden-source-topology-20261015' || github.ref == 'refs/heads/feature/aden-source-topology-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot and virtual GL display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
          curl -fL --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Prove installed source exists, import and photograph real Main.tscn
        run: |
          set -o pipefail
          mkdir -p aden-preview
          test -s data/map_remake/private/aden/navigation-00.bin
          test -s data/map_remake/private/aden/definitions/aden_world.json
          export XDG_DATA_HOME=\"$RUNNER_TEMP/aden-save\" APPDATA=\"$RUNNER_TEMP/aden-save\" LOCALAPPDATA=\"$RUNNER_TEMP/aden-save\" LIBGL_ALWAYS_SOFTWARE=1
          mkdir -p \"$XDG_DATA_HOME\"
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee aden-preview/import.log
          xvfb-run -a -s '-screen 0 1280x720x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --path . --rendering-driver opengl3 --audio-driver Dummy --script res://tools/map_restore/capture_maps.gd -- --maps=aden_world --output=\"$GITHUB_WORKSPACE/aden-preview\" 2>&1 | tee aden-preview/capture.log
          test -s aden-preview/aden_world-same-camera-detail.png
          test -s aden-preview/aden_world-full-map.png
          python3 - <<'PY'
          import json
          with open('aden-preview/captures.json') as f: data=json.load(f)
          m=data['maps']['aden_world']
          assert m['remake_topology'] and not m['authored_remake'], m
          assert not data['failures'], data['failures']
          print('ADEN_REAL_MAIN_CAPTURE_OK')
          PY
      - name: Upload screenshot evidence or failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aden-real-main-preview
          path: aden-preview/
          if-no-files-found: warn
