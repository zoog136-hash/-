name: TWILIGHT Card Special Policy Validate

on:
  pull_request:
    branches: ['main', 'feature/pve-only-scope-prune-20261012']
    paths:
      - 'data/catalog_v19.json'
      - 'scripts/transform_skill_options.gd'
      - 'scripts/card_option_visibility.gd'
      - 'scripts/world.gd'
      - 'scripts/hud.gd'
      - 'tests/card_special_policy_test.gd'
      - '.github/workflows/card-special-policy-validate.yml'
  workflow_dispatch:

# Manual audits stay independent; newer automatic revisions release old runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  card-specials:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Parse project and run focused policy test
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee card-import.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' card-import.log
          export XDG_DATA_HOME="$PWD/card-policy-user"
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/card_special_policy_test.gd 2>&1 | tee card-policy.log
          ! grep -E 'SCRIPT ERROR:|ERROR:|CARD_SPECIAL_POLICY_FAIL:|CARD_SPECIAL_POLICY_FAILED' card-policy.log
          grep -q 'CARD_SPECIAL_POLICY_OK' card-policy.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-special-policy-validation
          path: |
            card-import.log
            card-policy.log
          if-no-files-found: warn
