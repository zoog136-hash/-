name: Core Transition Validate

'on':
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: core-transition-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core runtime, save preservation and resource paths
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            /docs/.gdignore
            !/assets/
            !/external_map_packs/
      - name: Python syntax
        run: |
          python3 -m compileall -q tools tests
          python3 -m unittest discover -s tests -p 'test_*exchange*.py' -v
          python3 tests/test_ci_core.py
          python3 -m unittest discover -s tests -p test_patch523_world_links.py -v
          python3 tools/map_restore/test_current523_s32.py
          python3 tests/test_five_smith_smelt.py
          python3 tests/test_equipment523_alchemy.py
          python3 tests/test_five_set_invoke.py
          python3 tests/test_equipment523_effects_builder.py
          python3 -m unittest discover -s tests -p test_audit_character_attachments523.py -v
          python3 -m unittest discover -s tests -p test_source_auxiliary_selector.py -v
          python3 -m unittest discover -s tests -p test_reference_sp2_bank.py -v
          python3 -m unittest discover -s tests -p test_native_attachment_activation.py -v
          python3 -m unittest discover -s tests -p test_native_action_alias_metadata.py -v
          python3 -m unittest discover -s tests -p test_source_clothes_prefix.py -v
          python3 -m unittest discover -s tests -p test_source_missing_layer_occurrences.py -v
          python3 -m unittest discover -s tests -p test_connect_received_native_selector.py -v
          python3 -m unittest discover -s tools/lineagem_original -p test_client523_bank_metadata.py -v
      - name: Install pinned Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64"
      - name: Prepare exact current map inputs
        run: python3 tools/ci_core_map_pack.py --output "$RUNNER_TEMP/core-source-pack"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/core-project/.godot
          key: core-import-4.7.2-linux-v2-${{ hashFiles('project.godot', 'tools/ci_core.py', 'scripts/**/*.gd', 'addons/**', 'data/**/*.json', 'scenes/**/*.tscn', 'tests/core_runtime_save_test.gd') }}
          restore-keys: core-import-4.7.2-linux-v2-
      - name: Actual Main startup, current map, atomic save and migration
        env:
          TWILIGHT_SOURCE_MAP_PACK: ${{ runner.temp }}/core-source-pack
        run: python3 tools/ci_core.py --stage "$RUNNER_TEMP/core-project" --godot "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" --logs core-results
      - name: Preserve focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-transition-${{ github.sha }}
          path: core-results
          if-no-files-found: warn
          retention-days: 7
