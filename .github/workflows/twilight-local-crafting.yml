name: TWILIGHT Local Crafting

on:
  push:
    branches:
      - feature/twilight-local-crafting-v2-20261010
  pull_request:
    branches:
      - feature/twilight-npc-teleport-20261010
      - main
  workflow_dispatch:

jobs:
  crafting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        run: |
          curl -L --fail --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Project asset import and GDScript parse
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee craft-import.log
          ! grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' craft-import.log
      - name: Crafting and NPC regression
        run: |
          set -o pipefail
          for test in tests/local_crafting_test.gd tests/npc_teleport_test.gd tests/warehouse_persistence_test.gd tests/shop_authority_test.gd; do
            /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$test" 2>&1 | tee -a craft-test.log
          done
          ! grep -E 'SCRIPT ERROR:|ERROR:|FAIL:' craft-test.log
          for marker in CRAFT_OK NPC_TELEPORT_OK WAREHOUSE_OK SHOP_AUTHORITY_OK; do grep -q "$marker" craft-test.log; done
      - name: Run actual main scene headless for 120 frames
        run: |
          set -o pipefail
          timeout 30s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 120 2>&1 | tee craft-main-boot.log
          ! grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' craft-main-boot.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twilight-crafting-evidence
          path: |
            craft-import.log
            craft-test.log
            craft-main-boot.log
