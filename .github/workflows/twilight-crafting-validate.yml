name: TWILIGHT Atomic Crafting

on:
  pull_request:
    branches:
      - main
      - feature/twilight-warehouse-persistent-instances-20261010
  workflow_dispatch:

# Preserve in-flight PR122 audits; avoid automatic cancellation of costly Godot imports.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.pull_request.number != 157 && github.event.pull_request.number != 158 }}

jobs:
  atomic-crafting:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        uses: ./.github/actions/setup-godot-linux
      - name: Restore trusted Godot imported resources
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.number != 157 && github.event.pull_request.number != 158) }}
        id: trusted-import-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .godot/imported
            **/*.import
          key: twilight-godot-import-4.7.2-linux-compat-main-v1
      - name: Import project and GDScript
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee crafting-import.log
          ! grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' crafting-import.log
      - name: Crafting + warehouse + shop regressions
        run: |
          set -o pipefail
          for test in tests/crafting_atomic_test.gd tests/crafting_material_drop_test.gd tests/crafting_scroll_grade_test.gd tests/loot_balance_smoke_test.gd tests/ground_loot_system_test.gd tests/warehouse_persistence_test.gd tests/shop_authority_test.gd; do
            /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script "res://$test" 2>&1 | tee -a crafting-test.log
          done
          ! grep -E 'SCRIPT ERROR:|ERROR:|FAIL:' crafting-test.log
          grep -q CRAFTING_OK crafting-test.log
          grep -q CRAFT_MATERIAL_OK crafting-test.log
          grep -q CRAFT_SCROLL_OK crafting-test.log
          grep -q LOOT_BALANCE_OK crafting-test.log
          grep -q GROUND_LOOT_SYSTEM_OK crafting-test.log
          grep -q WAREHOUSE_OK crafting-test.log
          grep -q SHOP_AUTHORITY_OK crafting-test.log
      - name: Persist CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twilight-crafting-evidence
          path: |
            crafting-import.log
            crafting-test.log
