name: TWILIGHT Monster AI Leash and Path

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Manual audits stay independent; newer automatic revisions release old runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  monster-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        uses: ./.github/actions/setup-godot-linux
      - name: Provision software OpenGL for frame-dependent regressions
        uses: ./.github/actions/setup-software-gl
      - name: Restore trusted Godot imported resources
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.number != 157 && github.event.pull_request.number != 158) }}
        id: trusted-import-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .godot/imported/*.webp-*
            .godot/imported/*.svg-*
            .godot/imported/*.ttf-*
            .godot/imported/*.wav-*
            **/*.import
          key: twilight-godot-import-4.7.2-linux-compat-main-v2-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            twilight-godot-import-4.7.2-linux-compat-main-v2-
      - name: Monster AI, navigation and combat regressions
        # Every PR also runs Integration's unfiltered suite; other events keep it here.
        env:
          TWILIGHT_CI_TESTS: ${{ github.event_name == 'pull_request' && 'import,bake_navigation,boot,native_png_route_recovery_test,monster_ai_leash_path_test,monster_attack_profiles_test,monster_world_test,hunting_paths_test,hunting_navigation_cache_test,l1j_source_navigation_test,combat_resolution_equivalence_test,combat_timing_test,combat_timeline_lifecycle_test,aden_faith_png_monster_spawns_test,native_png_monster_spawns_test' || '' }}
        run: |
          set -o pipefail
          python3 tools/test_project.py --godot /tmp/Godot_v4.7.2-stable_linux.x86_64 --import-timeout 1500 --logs test-results --only "$TWILIGHT_CI_TESTS" 2>&1 | tee monster-ai-tests.log
          grep -q MONSTER_AI_OK test-results/monster_ai_leash_path_test.log
      - name: Archive exact test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twilight-monster-ai-full-validation
          path: |
            test-results
            monster-ai-tests.log
