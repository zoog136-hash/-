name: L1J Runtime and Recovery Validation

on:
  pull_request:
    branches: [main, feature/twilight-l1j-map-grid-adapter-20261010, feature/twilight-l1j-recovery-runtime-20261010]
    paths:
      - 'addons/twilight_l1j/**'
      - 'data/l1j/live_visual_bindings.json'
      - 'data/l1j/reviewed_shop_bindings.json'
      - 'scripts/shop/**'
      - 'scripts/ui/renewal_shop.gd'
      - 'scripts/ui/renewal_hud.gd'
      - 'scripts/world.gd'
      - 'scripts/loot/**'
      - 'scripts/monsters/monster_art.gd'
      - 'scripts/ui/renewal_theme.gd'
      - 'scripts/ui/ground_alpha.gd'
      - 'scripts/ui/item_visual_resolver.gd'
      - 'data/ground_alpha.json'
      - 'assets/ground_alpha/**'
      - 'tests/ground_alpha_test.gd'
      - 'tests/inventory_db_smoke_test.gd'
      - 'tests/l1j_*'
      - 'tests/capture_l1j_runtime.gd'
      - 'tools/l1j/**'
      - 'tools/test_project.py'
      - 'export_presets.cfg'
      - '.github/workflows/l1j-runtime-validate.yml'
  workflow_dispatch:
    inputs:
      retry_scope:
        description: Full validation, or the authenticated PR122 Linux remainder
        type: choice
        default: full
        options:
          - full
          - linux_remaining

# Manual audits stay independent; newer automatic revisions release old runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(
          (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.retry_scope == 'linux_remaining'))
          && '{"include":[{"os":"ubuntu-24.04","artifact":"linux.x86_64","executable":"Godot_v4.7.2-stable_linux.x86_64","job_minutes":240}]}'
          || '{"include":[{"os":"ubuntu-24.04","artifact":"linux.x86_64","executable":"Godot_v4.7.2-stable_linux.x86_64","job_minutes":240},{"os":"windows-latest","artifact":"win64.exe","executable":"Godot_v4.7.2-stable_win64_console.exe","job_minutes":240}]}'
        ) }}
    runs-on: ${{ matrix.os }}
    # Both full suites retain every check and its individual deadline.
    # Only an explicit manual retry may resume the authenticated unchanged
    # Linux prefix; ordinary PR/manual validation still runs both platforms.
    timeout-minutes: ${{ matrix.job_minutes }}
    env:
      PYTHONUTF8: '1'
      TWILIGHT_CI_RETRY_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_scope || 'full' }}
    steps:
      # Preserve all PR122 source evidence; Windows Git needs long paths before checkout.
      - name: Enable Git long paths for Windows checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official Godot 4.7.2
        shell: python
        run: |
          import pathlib, urllib.request, zipfile
          url = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_${{ matrix.artifact }}.zip'
          urllib.request.urlretrieve(url, 'godot.zip')
          with zipfile.ZipFile('godot.zip') as z: z.extractall('engine')
          exe = pathlib.Path('engine/${{ matrix.executable }}')
          exe.chmod(0o755)
      # Read only caches produced by trusted main; imported large PNGs stay
      # uncached. Resource preflight and every assertion still run.
      - name: Restore trusted compact Godot import cache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .godot/imported/*.webp-*
            .godot/imported/*.svg-*
            .godot/imported/*.ttf-*
            .godot/imported/*.wav-*
            **/*.import
          key: twilight-godot-import-4.7.2-linux-compat-main-v2-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            twilight-godot-import-4.7.2-linux-compat-main-v2-
      - name: Restore trusted-main PNG import shards
        if: runner.os == 'Linux'
        uses: ./.github/actions/restore-godot-png-cache
      - name: Generate synthetic fixtures (no third-party game art)
        run: |
          python tools/l1j_ci_make_fixture.py --root .
          python tools/l1j/make_live_fixture.py --root .
      - name: Verify resource installation safety
        if: runner.os == 'Linux'
        run: python tools/l1j/test_pack_install.py
      - name: Windows real Main death-clock regression with durable reports
        if: runner.os == 'Windows'
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys, tempfile
          sys.path.insert(0, 'tools')
          from test_project_support import run_isolated, classify_result
          root = pathlib.Path.cwd()
          logs = root / 'l1j-test-results'
          logs.mkdir(exist_ok=True)
          engine = str(root / 'engine/${{ matrix.executable }}')
          cases = ['original_based_spear_captain_gameplay_test', 'original_based_spear_guard_red_gameplay_test', 'original_based_reaper_gameplay_test']
          for name in ['import', *cases]:
              report_path = logs / ('windows-' + name + '.gameplay.json')
              with tempfile.TemporaryDirectory(prefix='twilight-death-clock-') as private:
                  env = os.environ.copy()
                  env.update(dict.fromkeys(['APPDATA', 'LOCALAPPDATA', 'XDG_DATA_HOME'], private))
                  env['TWILIGHT_PR100_REPORT'] = str(report_path)
                  extra = ['--import'] if name == 'import' else ['--script', 'res://tests/' + name + '.gd']
                  command = [engine, '--headless', '--path', str(root), *extra]
                  try:
                      result = run_isolated(command, env=env, cwd=str(root), timeout=1800 if name == 'import' else 450)
                      output = result.stdout + result.stderr
                      ok, skipped = classify_result(name, result.returncode, output)
                  except subprocess.TimeoutExpired as error:
                      output = 'TIMEOUT ' + str(error)
                      ok, skipped = False, False
              (logs / ('windows-' + name + '.log')).write_text(output, encoding='utf-8')
              print(output, flush=True)
              assert ok and not skipped, name
              if name != 'import':
                  report = json.loads(report_path.read_text(encoding='utf-8'))
                  assert not report['failures'] and len(report['incoming']) == 8, name
      - name: Install software OpenGL capture dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Authenticate completed Linux prefix before a targeted retry
        if: github.event_name == 'workflow_dispatch' && inputs.retry_scope == 'linux_remaining'
        shell: python
        run: |
          import gzip, hashlib, json, pathlib, re, subprocess
          assert '${{ matrix.os }}' == 'ubuntu-24.04'
          source = 'f1247a0d3bdfe66fa011ab7d540e34ae782f2fe5'
          evidence = pathlib.Path('docs/remake/evidence/pr122-remaining106/batch15/ci-followup')
          proof = json.loads((evidence / 'linux-resume.json').read_text(encoding='utf-8'))
          assert proof['source_sha'] == source and proof['run_id'] == 39151478786 and proof['job_id'] == 117745847403
          log = gzip.decompress((evidence / 'linux-second.txt.gz').read_bytes())
          assert hashlib.sha256(log).hexdigest() == '82717592532c07e1c269f80c343697933d389ade27fe4d252472f757c766986d'
          assert proof['log_utf8_sha256'] == hashlib.sha256(log).hexdigest()
          states = []
          for line in log.decode('utf-8-sig').splitlines():
              match = re.match(r'^\S+ (PASS|SKIP|FAIL) ([A-Za-z0-9_]+)$', line.strip())
              if match:
                  states.append([match[1], match[2]])
          expected = ['import', 'bake_navigation', 'boot'] + [p.stem for p in sorted(pathlib.Path('tests').glob('*test.gd'))]
          assert states == proof['states'] and all(row[0] != 'FAIL' for row in states)
          assert [row[1] for row in states] == expected[:len(states)]
          pending = expected[len(states):]
          assert pending == proof['remaining'] == ['world_regions_test', 'world_structure_capture_test', 'world_structure_test', 'world_terrain_coverage_test']
          assert len(expected) == proof['original_check_count'] == 223
          subprocess.run(['git', 'fetch', '--no-tags', '--filter=blob:none', '--depth=1', 'origin', source], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', source, 'HEAD'], text=True).splitlines()
          assert all(p == '.github/workflows/l1j-runtime-validate.yml' or p.startswith('docs/remake/evidence/pr122-remaining106/batch15/ci-followup/') for p in changed), changed
          proof['validated_current_sha'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          proof['changed_ci_evidence_paths'] = changed
          proof['fresh_checks'] = ['import', 'bake_navigation', 'boot'] + pending
          logs = pathlib.Path('l1j-test-results')
          logs.mkdir(exist_ok=True)
          (logs / 'authenticated-linux-prefix.json').write_text(json.dumps(proof, indent=2) + '\n', encoding='utf-8')
          print('LINUX_PREFIX_AUTHENTICATED', json.dumps({k: proof[k] for k in ['source_sha', 'run_id', 'job_id', 'passed', 'skipped', 'remaining', 'validated_current_sha']}))
      - name: Import, boot and all regression checks with isolated saves
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          command = [sys.executable, 'tools/test_project.py', '--godot', 'engine/${{ matrix.executable }}', '--logs', 'l1j-test-results', '--timeout', '450', '--import-timeout', '2400']
          resumed = os.environ['TWILIGHT_CI_RETRY_SCOPE'] == 'linux_remaining'
          if resumed:
              proof = json.loads(pathlib.Path('l1j-test-results/authenticated-linux-prefix.json').read_text(encoding='utf-8'))
              command += ['--only', ','.join(proof['fresh_checks'])]
          subprocess.run(command, check=True)
          if resumed:
              current = json.loads(pathlib.Path('l1j-test-results/summary.json').read_text(encoding='utf-8'))
              assert current['checks'] == proof['fresh_checks'] and not current['failed'] and not current['not_run'] and not current['skipped']
              combined = {'total': proof['original_check_count'], 'passed': proof['passed'] + len(proof['remaining']), 'failed': [], 'skipped': proof['skipped'], 'not_run': [], 'reused_prefix': len(proof['states']), 'fresh_checks': proof['fresh_checks'], 'source_sha': proof['source_sha'], 'current_sha': proof['validated_current_sha'], 'source_log_sha256': proof['log_utf8_sha256']}
              assert combined['passed'] == 218 and len(combined['skipped']) == 5
              pathlib.Path('l1j-test-results/combined-linux-summary.json').write_text(json.dumps(combined, indent=2) + '\n', encoding='utf-8')
              print('LINUX_COMBINED_COVERAGE', json.dumps(combined))
      - name: Render the actual game with synthetic CI fixtures
        if: runner.os == 'Linux'
        env:
          XDG_DATA_HOME: ${{ github.workspace }}/l1j-render-userdata
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          xvfb-run -a engine/${{ matrix.executable }} --path . --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 --script res://tests/capture_l1j_runtime.gd 2>&1 | tee l1j-render.log
          grep -q 'L1J_RUNTIME_RENDER_OK' l1j-render.log
          if grep -E 'SCRIPT ERROR:|ERROR:' l1j-render.log; then exit 1; fi
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1j-runtime-${{ runner.os }}-synthetic
          path: |
            l1j-test-results/
            l1j-render-userdata/
            l1j-render.log
          if-no-files-found: warn

  android-export:
    runs-on: ubuntu-24.04
    # Cold full import took ~26 minutes; APK export then hit the old 40-minute job cap.
    # Keep the complete import, export, APK inspection and signing checks intact.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download official engine and Android templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d engine
          chmod +x engine/Godot_v4.7.2-stable_linux.x86_64
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q templates.tpz -d template-unpack
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp template-unpack/templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          cp template-unpack/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Prepare SDK, signing and synthetic image fixtures
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.1" "platform-tools"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -validity 1000 -keyalg RSA -keysize 2048 -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keystore "$HOME/.android/l1j-debug.keystore" -storepass android -keypass android
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/l1j-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          python3 tools/l1j/make_live_fixture.py --root .
      - name: Import game and configure Android editor paths
        run: |
          set -euo pipefail
          engine/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit > android-import.log 2>&1
          if grep -E 'SCRIPT ERROR:|ERROR:' android-import.log; then exit 1; fi
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          directory = Path.home()/'.config/godot'
          candidates = list(directory.glob('editor_settings-*.tres'))
          if not candidates: raise RuntimeError('Editor settings were not generated')
          for path in candidates:
              text = path.read_text()
              for key, value in [('export/android/android_sdk_path',os.environ['ANDROID_HOME']),('export/android/java_sdk_path',os.environ['JAVA_HOME'])]:
                  line = key + ' = "' + value.replace('\\','/') + '"'
                  pattern = '^' + re.escape(key) + r'\s*=.*$'
                  text = re.sub(pattern, lambda _: line, text, flags=re.M) if re.search(pattern,text,re.M) else text+'\n'+line+'\n'
              path.write_text(text)
          PY
      - name: Export and inspect signed ARM64 debug APK
        run: |
          set -euo pipefail
          mkdir -p build
          engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug Android build/TWILIGHT_L1J_SYNTHETIC_ARM64.apk > android-export.log 2>&1
          if grep -E 'SCRIPT ERROR:|ERROR:' android-export.log; then exit 1; fi
          python3 tools/l1j/inspect_apk.py --apk build/TWILIGHT_L1J_SYNTHETIC_ARM64.apk --bindings data/l1j/live_visual_bindings.json | tee android-inspection.json
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify build/TWILIGHT_L1J_SYNTHETIC_ARM64.apk
      - name: Preserve Android export evidence (synthetic art; no device execution)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1j-android-arm64-synthetic-export
          path: |
            build/TWILIGHT_L1J_SYNTHETIC_ARM64.apk
            android-import.log
            android-export.log
            android-inspection.json
          if-no-files-found: warn
