name: PR84 25-map terrain coverage validation
on:
  push:
    branches: [feature/twilight-reference-expansion-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resource integrity
        run: python3 tools/check_resource_integrity.py --root .
      - name: Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - name: Parse/import
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee terrain-import.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' terrain-import.log
      - name: OpenGL 25-map screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '3.3'
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --path . --rendering-driver opengl3 --script res://tests/world_terrain_coverage_test.gd 2>&1 | tee terrain-run.log
          grep -q WORLD_TERRAIN_OK terrain-run.log
          ! grep -E 'SCRIPT ERROR:|WORLD_TERRAIN_FAIL:|WORLD_TERRAIN_FAILED' terrain-run.log
      - name: Preserve screen evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr84-terrain-coverage-evidence
          path: |
            terrain-import.log
            terrain-run.log
            docs/playable-maps-20261011/terrain-coverage-evidence
          if-no-files-found: warn
