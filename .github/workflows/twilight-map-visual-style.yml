name: TWILIGHT 25 Map Visual Styles

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Manual audits stay independent; newer automatic revisions release old runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  map-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Restore trusted-main PNG import shards
        uses: ./.github/actions/restore-godot-png-cache
      - name: Install official Godot 4.7.2
        uses: ./.github/actions/setup-godot-linux
      - name: Provision software OpenGL for frame-dependent regressions
        uses: ./.github/actions/setup-software-gl
      - name: Map visuals, topology and runtime regressions
        # Every PR also runs Integration's unfiltered suite; other events keep it here.
        env:
          TWILIGHT_CI_TESTS: ${{ github.event_name == 'pull_request' && 'import,bake_navigation,boot,native_png_route_recovery_test,map_visual_toggle_test,world_region_portals_test,world_regions_test,world_structure_test,world_terrain_coverage_test,terrain_surface_geometry_test,terrain_surface_render_test,terrain_variation_texture_test,road_surface_mesh_test,road_surface_render_test,remake_map_readability_test,remake_coordinates_and_state_test,remake_door_runtime_test,native_png_layer_ownership_test' || '' }}
        run: |
          set -o pipefail
          python3 tools/test_project.py --godot /tmp/Godot_v4.7.2-stable_linux.x86_64 --logs test-results --import-timeout 1800 --only "$TWILIGHT_CI_TESTS" 2>&1 | tee map-visuals-test.log
          grep -q MAP_VISUAL_OK test-results/map_visual_toggle_test.log
      - name: Save exact engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twilight-visual-25maps-evidence
          path: |
            test-results
            map-visuals-test.log
