name: Inventory Inven Icons
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inventory-inven-icons.yml'
      - 'tools/inven_inventory/**'
      - 'scripts/ui/item_visual_resolver.gd'
      - 'scripts/ui/inven_inventory_icons.gd'
      - 'scripts/consumable_rules.gd'
      - 'data/inven_inventory_icons.json'
      - 'data/catalog_v19.json'
      - 'data/game_db_v17.json'
      - 'data/item_visual_provenance.json'
      - 'assets/inven_inventory/**'
      - 'assets/catalog/**'
      - 'tests/inven_inventory_icons_test.gd'
      - 'tests/capture_inven_inventory.gd'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inventory-inven-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate every committed image offline; never fetch new art in PRs
        run: |
          python3 -m pip install Pillow==12.3.0
          python3 tools/inven_inventory/build.py
      - name: Install repository-pinned Godot and software renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          curl --fail --location --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -qo /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Check all runtime pictures, untouched ground art, item interactions and UI captures
        run: python3 tools/inven_inventory/verify.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --output /tmp/inventory-inven
      - name: No gameplay, image or source mutation during verification
        run: git diff --exit-code -- scripts data assets tools tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-inven-validation-${{ github.sha }}
          path: |
            /tmp/inventory-inven/*.log
            /tmp/inventory-inven/*.json
            /tmp/inventory-inven/captures/
          retention-days: 14
          if-no-files-found: warn
