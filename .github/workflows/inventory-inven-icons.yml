name: Inventory Inven Icons
on:
  push:
    branches: [feature/inventory-inven-icons-20261014]
    paths: ['.github/workflows/inventory-inven-icons.yml']
permissions:
  contents: read
concurrency:
  group: inventory-inven-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Read final material sources
        run: |
          mkdir -p /tmp/inventory-inven
          python3 - <<'PY'
          import json,pathlib
          from playwright.sync_api import sync_playwright
          result={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True); page=browser.new_page()
              page.goto('https://lineagem.inven.co.kr/db/item/',wait_until='domcontentloaded',timeout=60000)
              page.wait_for_selector('#lineagemDbItem input.search',timeout=30000)
              for term in ['엔트','미스릴','나무','잎','열매','동','연마','용옥','옥','지혜','용기','녹색','속성','초기화','힘의 엘릭서']:
                  data=page.evaluate('''async term => {const body=new FormData(); body.append('name',term); return await (await fetch('/db/item/list',{method:'POST',body,credentials:'include'})).json();}''',term)
                  result[term]=data
                  print(term,len(data.get('items',[])),flush=True)
              browser.close()
          pathlib.Path('/tmp/inventory-inven/final-material-sources.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-inven-final-materials
          path: /tmp/inventory-inven/
          retention-days: 7
          if-no-files-found: error
