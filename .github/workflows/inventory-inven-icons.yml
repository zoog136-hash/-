name: Inventory Inven Icons
on:
  push:
    branches: [feature/inventory-inven-icons-20261014]
    paths: ['.github/workflows/inventory-inven-icons.yml', 'tools/inven_inventory/build.py', 'scripts/ui/inven_inventory_icons.gd', 'scripts/ui/item_visual_resolver.gd', 'data/inven_inventory_icons.json']
permissions:
  contents: read
concurrency:
  group: inventory-inven-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install browser
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Collect inventory source records
        run: |
          mkdir -p /tmp/inventory-inven
          python3 - <<'PY'
          import json, pathlib, re, html, urllib.request
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('/tmp/inventory-inven'); result={}
          terms=['회복','주문서','드래곤','엘릭서','화살','탄환','철','천','가죽','목재','약초','가루','결정','광석','비법서','스테이크','연어','칠면조','용옥','루비','사파이어','아데나','성수','실','보석']
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page()
              page.goto('https://lineagem.inven.co.kr/db/item/',wait_until='domcontentloaded',timeout=60000)
              page.wait_for_selector('#lineagemDbItem input.search',timeout=30000)
              for term in terms:
                  try:
                      data=page.evaluate('''async term => {const body=new FormData(); body.append('name',term); return await (await fetch('/db/item/list',{method:'POST',body,credentials:'include'})).json();}''',term)
                      result['search_'+term]=data
                      print(term,len(data.get('items',[])) if isinstance(data,dict) else str(data)[:100],flush=True)
                  except Exception as e: result['search_'+term]={'error':str(e)}
              browser.close()
          for code in [3,52,79,8,6,9,51,53]:
              try:
                  url='https://lineagem.inven.co.kr/db/item/?filtering='+str(code)
                  req=urllib.request.Request(url,headers={'User-Agent':'TWILIGHT-inventory-icons/1.0'})
                  with urllib.request.urlopen(req,timeout=25) as r: text=r.read(4000000).decode('utf-8')
                  m=re.search(r'id="lineagemDbItem"\s+data-props="([^"]+)"',text)
                  data=json.loads(html.unescape(m[1]));result['category_'+str(code)]=data
                  print('category',code,data.get('defaultFilter'),len(data.get('items',[])),flush=True)
              except Exception as e: result['category_'+str(code)]={'error':str(e)}
          (out/'browser-sources.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-inven-browser-sources
          path: /tmp/inventory-inven/
          retention-days: 7
          if-no-files-found: error
