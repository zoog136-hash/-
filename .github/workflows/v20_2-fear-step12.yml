name: V20.2 Fear Step12 Test

on:
  push:
    branches: [v20-2-fear-step12]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v20-2-fear-step12

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' | head -1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Parse project
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --editor --path . --quit 2>&1 | tee /tmp/editor.log
          if grep -Eiq "Parse Error|Failed to load script|SCRIPT ERROR|Invalid access|Invalid call|Node not found|^ERROR:" /tmp/editor.log; then
            exit 1
          fi

      - name: Create fear test
        shell: bash
        run: |
          cat > test_fear_step12.gd <<'GD'
          extends SceneTree

          var failures: Array[String] = []

          func check(value: bool, message: String) -> void:
              if not value:
                  failures.append(message)
                  push_error("TEST FAIL: " + message)

          func approx(a: float, b: float, eps: float = 0.0001) -> bool:
              return absf(a - b) <= eps

          func _init() -> void:
              call_deferred("run_tests")

          func run_tests() -> void:
              var packed: PackedScene = load("res://Main.tscn") as PackedScene
              check(packed != null, "Main loads")
              if packed == null:
                  quit(1)
                  return

              var world: Node = packed.instantiate()
              root.add_child(world)
              await process_frame
              await process_frame
              world.process_mode = Node.PROCESS_MODE_DISABLED

              world.equipped_catalog = {"변신":{}, "마법인형":{}, "성물":{}}
              world.equipped_items = {"weapon":{}, "armor":{}, "accessory":{}}
              world.level = 35
              world.int_stat = 16
              world.wis_stat = 16

              check(world._fear_accuracy_stat() == 7, "base fear accuracy")
              check(world._fear_resistance_stat() == 7, "base fear resistance")

              world.equipped_items["weapon"] = {"fear_accuracy":8}
              world.equipped_catalog["성물"] = {"공포 적중":5}
              world.equipped_items["armor"] = {"fear_resistance":6}
              world.equipped_items["accessory"] = {"피어 내성":4}
              check(world._fear_accuracy_stat() == 20, "fear accuracy stacks")
              check(world._fear_resistance_stat() == 17, "fear resistance stacks")

              var snapshot: Dictionary = world._character_stats_snapshot()
              check(int(snapshot.get("fear_accuracy", -1)) == 20, "snapshot fear accuracy")
              check(int(snapshot.get("fear_resistance", -1)) == 17, "snapshot fear resistance")

              var monster_scene: PackedScene = load("res://scenes/Monster.tscn") as PackedScene
              check(monster_scene != null, "Monster scene loads")
              var monster: TwilightMonster = monster_scene.instantiate() as TwilightMonster
              root.add_child(monster)
              monster.setup({
                  "name":"공포 테스트","lv":20,"hp":100000,"atk":40,"def":5,"xp":10,"speed":100,
                  "fear_accuracy":25,"fear_resistance":14,"fear_duration":1.5,"mr":0
              }, world.player, world, null)
              check(monster.fear_accuracy == 25, "monster fear accuracy")
              check(monster.fear_resistance == 14, "monster fear resistance")
              check(approx(monster.fear_duration, 1.5), "monster fear duration")

              # Player fear state and away vector.
              world.player.global_position = Vector2(200, 100)
              world.player.apply_fear(0.30, Vector2(100, 100))
              check(world.player.is_feared(), "player enters fear")
              check(not world.player.is_stunned(), "fear is not stun")
              check(not world.player.is_held(), "fear is not hold")
              var pv: Vector2 = world.player._fear_velocity()
              check(pv.x > 0.0 and absf(pv.y) < 0.01, "player fear moves away from source")
              check(approx(pv.length(), world.player.move_speed * world.player.fear_move_multiplier, 0.01), "player fear speed")
              world.player._tick_fear(0.10)
              check(world.player.is_feared(), "player fear persists")
              world.player._tick_fear(0.25)
              check(not world.player.is_feared(), "player fear expires")

              # Monster fear vector.
              monster.global_position = Vector2(300, 100)
              monster.apply_fear(0.30, Vector2(200, 100))
              check(monster.is_feared(), "monster enters fear")
              var mv: Vector2 = monster._fear_velocity()
              check(mv.x > 0.0 and absf(mv.y) < 0.01, "monster fear moves away from source")
              check(approx(mv.length(), monster.move_speed * monster.fear_move_multiplier, 0.01), "monster fear speed")
              monster._tick_fear(0.35)
              check(not monster.is_feared(), "monster fear expires")

              # Actual Fear cast.
              world.level = 100
              world.int_stat = 50
              world.mp = 1000
              world.equipped_items = {
                  "weapon":{"fear_accuracy":100},
                  "armor":{},
                  "accessory":{}
              }
              world.equipped_catalog = {"변신":{}, "마법인형":{}, "성물":{}}
              world.player.global_position = Vector2.ZERO
              monster.global_position = Vector2(100, 0)
              monster.monster_level = 1
              monster.magic_resistance = 0
              monster.fear_resistance = 0
              monster.fear_remaining = 0.0
              check(approx(world._player_fear_chance(monster), 0.95), "player fear chance cap")
              var fear_success: bool = false
              for seed_value: int in range(1, 80):
                  world.rng.seed = seed_value
                  world.mp = 1000
                  monster.fear_remaining = 0.0
                  if world._cast_fear_skill(monster, 10, 2.5, "피어"):
                      fear_success = true
                      break
              check(fear_success, "Fear skill can succeed")
              check(monster.is_feared(), "Fear applies to monster")
              check(world.mp == 990, "Fear consumes MP")
              check(monster.fear_source_position == world.player.global_position, "Fear stores caster position")

              # Feared player cannot act.
              world.player.fear_remaining = 5.0
              world.player.fear_source_position = Vector2(-100, 0)
              monster.fear_remaining = 0.0
              monster.dead = false
              monster.hp = 100000
              monster.armor_class = -1
              monster.magic_resistance = 0
              monster.global_position = world.player.global_position + Vector2(50, 0)
              world.selected_monster = monster
              world.auto_target = monster
              world.auto_attack_timer = 0.0
              world.level = 200
              world.str_stat = 50
              world.int_stat = 50
              var hp_before_attack: int = monster.hp
              world._attack()
              check(monster.hp == hp_before_attack, "fear blocks normal attack")

              world.mp = 1000
              var mp_before_magic: int = world.mp
              var magic_result: bool = world._cast_magic_attack(monster, 30, 3, "에너지 볼트")
              check(not magic_result, "fear blocks magic")
              check(world.mp == mp_before_magic, "blocked magic consumes no MP")

              var hold_result: bool = world._cast_hold_skill(monster, 8, 2.0, "홀드")
              var silence_result: bool = world._cast_silence_skill(monster, 8, 2.0, "사일런스")
              var stun_result: bool = world._cast_stun_skill(monster, 10, 8, 1.0, "쇼크 스턴")
              check(not hold_result and not silence_result and not stun_result, "fear blocks active skills")
              check(world.mp == mp_before_magic, "blocked skills consume no MP")

              var hp_before_auto: int = monster.hp
              world._run_auto_hunt()
              check(monster.hp == hp_before_auto, "fear blocks auto attack")

              # Hold + fear: status can coexist and hold remains active.
              world.player.apply_hold(2.0)
              check(world.player.is_held() and world.player.is_feared(), "hold and fear coexist")

              # Incoming monster fear.
              world.player.fear_remaining = 0.0
              world.player.hold_remaining = 0.0
              world.player.stun_remaining = 0.0
              world.player.silence_remaining = 0.0
              world.hp = 5000
              world.max_hp = 5000
              world.level = 1
              world.wis_stat = 10
              world.equipped_items = {"weapon":{}, "armor":{}, "accessory":{}}
              world.equipped_catalog = {"변신":{}, "마법인형":{}, "성물":{}}
              monster.global_position = Vector2(100, 0)
              world.player.global_position = Vector2.ZERO
              monster.monster_level = 100
              monster.melee_accuracy = 999
              monster.melee_critical_rate = 0
              monster.stun_duration = 0.0
              monster.silence_duration = 0.0
              monster.hold_duration = 0.0
              monster.fear_accuracy = 100
              monster.fear_duration = 1.25
              var incoming_success: bool = false
              for seed_value: int in range(1, 100):
                  world.player.fear_remaining = 0.0
                  world.hp = 5000
                  world.rng.seed = seed_value
                  world._on_player_hit(monster, 10, "melee")
                  if world.player.is_feared():
                      incoming_success = true
                      break
              check(incoming_success, "monster fear can affect player")
              check(world.player.fear_remaining > 0.0, "incoming fear duration stored")
              check(world.player.fear_source_position == monster.global_position, "incoming fear source stored")

              # High resistance floors chance.
              world.equipped_items["armor"] = {"fear_resistance":100}
              monster.fear_accuracy = 5
              check(approx(
                  world._status_effect_chance(monster.fear_accuracy, monster.monster_level, world._fear_resistance_stat(), world.level),
                  0.05
              ), "high fear resistance reaches floor")

              # Regression.
              check(world._hold_accuracy_stat() >= 0, "hold preserved")
              check(world._silence_accuracy_stat() >= 0, "silence preserved")
              check(world._stun_accuracy_stat() >= 0, "stun preserved")
              check(world._critical_damage(100) == 150, "critical preserved")
              check(world._effective_mr() > 0, "MR preserved")

              if failures.is_empty():
                  print("V20.2 FEAR STEP12 PASS")
                  quit(0)
              else:
                  print("FAILURES ", failures)
                  quit(1)
          GD

      - name: Run fear test
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path . --script res://test_fear_step12.gd 2>&1 | tee /tmp/fear.log
          grep -q "V20.2 FEAR STEP12 PASS" /tmp/fear.log
          if grep -Eiq "TEST FAIL|Parse Error|Failed to load script|SCRIPT ERROR|Invalid access|Invalid call|Node not found|Failed loading resource|^ERROR:" /tmp/fear.log; then
            exit 1
          fi
