name: Card Reveal Effects
on:
  pull_request:
    paths:
      - 'scripts/ui/card_reveal_*.gd'
      - 'scripts/ui/renewal_hud.gd'
      - 'scripts/world.gd'
      - 'data/presentation/card_reveal_profiles.json'
      - 'assets/card_reveal/**'
      - 'tests/card_reveal_integration_test.gd'
      - 'tests/card_reveal_timeline_test.gd'
      - 'tests/capture_card_reveal.gd'
      - '.github/workflows/card-reveal-effects.yml'
  workflow_dispatch:
jobs:
  card-reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 and virtual OpenGL
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Check committed resources and targeted native integration
        run: |
          python3 tools/check_resource_integrity.py --root .
          python3 tools/test_project.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --only import,boot,card_draw_fusion_test,card_reveal_integration_test,card_reveal_timeline_test,ui_renewal_integration_test --logs card-reveal-checks
      - name: Capture native grade reveal
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          XDG_DATA_HOME: /tmp/card-reveal-capture-data
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --path . --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/capture_card_reveal.gd -- --mode=grades --output="$PWD/card-reveal-capture" 2>&1 | tee card-reveal-capture.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' card-reveal-capture.log
          grep -q CARD_REVEAL_CAPTURE_OK card-reveal-capture.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-reveal-native-evidence
          path: |
            card-reveal-checks/
            card-reveal-capture/
            card-reveal-capture.log
