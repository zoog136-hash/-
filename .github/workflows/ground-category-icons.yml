name: Ground Category Icons
on:
  push:
    branches: [feature/ground-category-icons-20261015]
    paths: ['.github/workflows/ground-category-icons.yml', 'tools/ground_icons/**']
permissions:
  contents: read
jobs:
  ground-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Package complete runtime with immutable source hashes
        run: |
          mkdir -p /tmp/ground-icons
          python3 - <<'PY'
          import pathlib,subprocess,zipfile,json,hashlib
          root=pathlib.Path('.'); out=pathlib.Path('/tmp/ground-icons'); hashes={}
          with zipfile.ZipFile(out/'runtime.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files'],text=True).splitlines():
                  p=root/name
                  if not p.is_file() or name.startswith(('docs/','releases/','evidence/','screenshots/','.github/')) or p.suffix in ['.zip','.mp4','.apk']:continue
                  z.write(p,name); hashes[name]=hashlib.sha256(p.read_bytes()).hexdigest()
          (out/'source-hashes.json').write_text(json.dumps(hashes,ensure_ascii=False,indent=2))
          print('RUNTIME_READY',len(hashes),'files')
          PY
          curl --fail --location --retry 2 -o /tmp/ground-icons/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ground-icons-runtime
          path: /tmp/ground-icons/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
