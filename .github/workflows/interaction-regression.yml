name: Eight Interaction Regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'tools/test_interactions.py'
      - '.github/workflows/interaction-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-input-and-loot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preserve original resource inventory
        run: python3 tools/check_resource_integrity.py --root .
      - name: Install project Godot version
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Real mouse and native-touch event regressions
        run: python3 tools/test_interactions.py --godot /tmp/Godot_v4.7.2-stable_linux.x86_64 --prepare --logs test-results/interactions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interaction-regression-${{ github.sha }}
          path: test-results/interactions/
          if-no-files-found: error
