name: PNG documentation evidence temporary archive
on:
  push:
    branches:
      - archive/png-drive-20261018
permissions:
  contents: read
jobs:
  archive-doc-png:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs
          sparse-checkout-cone-mode: true
      - name: Split documentation PNG into <=72 MiB original-byte ZIPs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib, json
          images=sorted(p for p in Path("docs").rglob("*.png") if p.is_file())
          if not images:
              raise SystemExit("No docs PNG found")
          dest=Path("archive-output")
          dest.mkdir(exist_ok=True)
          limit=72*1024*1024
          parts=[]
          current=[]
          size=0
          for p in images:
              n=p.stat().st_size
              if current and size+n>limit:
                  parts.append(current)
                  current=[]
                  size=0
              current.append(p)
              size+=n
          if current:
              parts.append(current)
          if len(parts)>35:
              raise SystemExit("More than 35 archive parts required: "+str(len(parts)))
          for i, group in enumerate(parts, 1):
              path=dest/("TWILIGHT_docs_PNG_part_%02d.zip"%i)
              manifest={"part":i,"parts":len(parts),"source":"zoog136-hash/-",
                        "scope":"docs/**/*.png - documentation evidence, not proven unused",
                        "source_paths_preserved":True,"removal_approved":False,"files":[]}
              with zipfile.ZipFile(path,"w",compression=zipfile.ZIP_STORED,allowZip64=True) as out:
                  for p in group:
                      sha=hashlib.sha256()
                      with p.open("rb") as stream:
                          for b in iter(lambda:stream.read(1024*1024),b""):
                              sha.update(b)
                      out.write(p,arcname=p.as_posix())
                      manifest["files"].append({"path":p.as_posix(),"size":p.stat().st_size,"sha256":sha.hexdigest()})
                  out.writestr("MANIFEST.json",json.dumps(manifest,ensure_ascii=False,indent=2))
              print(path, len(group), path.stat().st_size,flush=True)
          print("PART_COUNT",len(parts),"PNG_COUNT",len(images),flush=True)
          PY
      - name: Upload PNG backup part 01
        uses: actions/upload-artifact@v4
        with:
          name: TWILIGHT-docs-PNG-part-01
          path: archive-output/TWILIGHT_docs_PNG_part_01.zip
          retention-days: 7
          if-no-files-found: ignore
          compression-level: 0
