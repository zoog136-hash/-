name: Animation Presentation Validate
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/animation/**'
      - 'scripts/monsters/**'
      - 'scripts/monster.gd'
      - 'scripts/player.gd'
      - 'scripts/world.gd'
      - 'data/animation_presentation.json'
      - 'data/combat_animation_profiles.json'
      - 'assets/actors/eight_direction/**'
      - 'tools/build_animation_expansion.py'
      - 'tools/build_open_sprite_sample.gd'
      - 'tools/*original_based_motion*'
      - 'data/animation_authoring_sources.json'
      - 'tests/original_based*'
      - 'tests/*animation*'
      - 'tests/*presentation*'
      - '.github/workflows/animation-presentation-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: animation-presentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing resource ledger
        run: python3 tools/check_resource_integrity.py --root .
      - name: Install pinned Godot and software GL
        run: |
          curl -L --fail --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
      - name: Import and full identity / combat regressions
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/presentation"
          ENGINE=/tmp/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p test-results
          "$ENGINE" --headless --path . --editor --quit 2>&1 | tee test-results/presentation-import.txt
          if grep -E 'SCRIPT ERROR:|ERROR:' test-results/presentation-import.txt; then exit 1; fi
          python3 tests/animation_expansion_plan_test.py 2>&1 | tee test-results/animation-expansion-plan.txt
          python3 -m pip install 'Pillow==11.3.0' 'numpy==2.2.6' 'scipy==1.15.3'
          python3 tests/eight_direction_coverage_audit_test.py
          python3 tests/original_based_motion_import_test.py
          python3 tools/audit_eight_direction_coverage.py --root . --output-dir test-results/eight-direction-coverage
          for name in eight_direction_animation_test native_animation_expansion_test original_based_canvas_test; do
            "$ENGINE" --headless --path . --script "res://tests/${name}.gd" 2>&1 | tee "test-results/${name}.txt"
            if grep -E 'SCRIPT ERROR:|ERROR:|FAIL' "test-results/${name}.txt"; then exit 1; fi
          done
          for name in actor_motion_test animation_presentation_test boss_presentation_test authored_state_motion_test animation_restore_test monster_attack_profiles_test combat_timing_test combat_resolution_equivalence_test volley_motion_test hit_feedback_test combat_vfx_test; do
            "$ENGINE" --headless --path . --script "res://tests/${name}.gd" 2>&1 | tee "test-results/${name}.txt"
            if grep -E 'SCRIPT ERROR:|ERROR:|FAIL:' "test-results/${name}.txt"; then exit 1; fi
            grep -q '_OK' "test-results/${name}.txt"
          done
          XDG_DATA_HOME="${RUNNER_TEMP}/aden-boss-special" "$ENGINE" --headless --path . --script res://tests/aden_boss_special_test.gd 2>&1 | tee test-results/aden-boss-special.txt
          if grep -E 'SCRIPT ERROR:|ERROR:|ADEN_BOSS_SPECIAL_FAIL' test-results/aden-boss-special.txt; then exit 1; fi
          grep -q 'ADEN_BOSS_SPECIAL_OK' test-results/aden-boss-special.txt
          "$ENGINE" --headless --path . --script res://tests/pr100_direction_gameplay_test.gd 2>&1 | tee test-results/pr100-direction-gameplay.txt
          if grep -E 'SCRIPT ERROR:|ERROR:|PR100_GAMEPLAY_FAIL' test-results/pr100-direction-gameplay.txt; then exit 1; fi
          grep -q 'PR100_DIRECTION_GAMEPLAY_OK' test-results/pr100-direction-gameplay.txt
          for name in original_based_monster_gameplay_test original_based_ghost_gameplay_test original_based_ogre_gameplay_test original_based_reaper_gameplay_test; do
            XDG_DATA_HOME="${RUNNER_TEMP}/${name}" "$ENGINE" --headless --path . --script "res://tests/${name}.gd" 2>&1 | tee "test-results/${name}.txt"
            if grep -E 'SCRIPT ERROR:|ERROR:|PR100_GAMEPLAY_FAIL' "test-results/${name}.txt"; then exit 1; fi
            grep -q 'PR100_DIRECTION_GAMEPLAY_OK' "test-results/${name}.txt"
          done
      - name: All boss poses and real gameplay renders
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/presentation"
          export LIBGL_ALWAYS_SOFTWARE=1
          for name in capture_presentation_gallery capture_presentation_sequences capture_combat benchmark_presentation_battles; do
            xvfb-run -a -s '-screen 0 1280x720x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --audio-driver Dummy --path . --script "res://tests/${name}.gd" 2>&1 | tee "test-results/${name}.txt"
            if grep -E 'SCRIPT ERROR:|ERROR:|FAIL:|FAILED' "test-results/${name}.txt"; then exit 1; fi
          done
          export TWILIGHT_PR100_CAPTURE_DIR="${RUNNER_TEMP}/pr100-main-directions"
          export TWILIGHT_PR100_REPORT="${RUNNER_TEMP}/pr100-main-directions/gameplay.json"
          XDG_DATA_HOME="${RUNNER_TEMP}/pr100-main-user" timeout 600 xvfb-run -a -s '-screen 0 1280x720x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --audio-driver Dummy --path . --script res://tests/pr100_direction_gameplay_test.gd 2>&1 | tee test-results/pr100-main-render.txt
          if grep -E 'SCRIPT ERROR:|ERROR:|PR100_GAMEPLAY_FAIL' test-results/pr100-main-render.txt; then exit 1; fi
          grep -q 'PR100_DIRECTION_GAMEPLAY_OK' test-results/pr100-main-render.txt
          for name in original_based_monster_gameplay_test original_based_ghost_gameplay_test original_based_ogre_gameplay_test original_based_reaper_gameplay_test; do
            TWILIGHT_PR100_CAPTURE_DIR="${RUNNER_TEMP}/${name}-render" TWILIGHT_PR100_REPORT="${RUNNER_TEMP}/${name}-render/gameplay.json" XDG_DATA_HOME="${RUNNER_TEMP}/${name}-render-user" timeout 300 xvfb-run -a -s '-screen 0 1280x720x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --audio-driver Dummy --path . --script "res://tests/${name}.gd" 2>&1 | tee "test-results/${name}-render.txt"
            if grep -E 'SCRIPT ERROR:|ERROR:|PR100_GAMEPLAY_FAIL' "test-results/${name}-render.txt"; then exit 1; fi
            grep -q 'PR100_DIRECTION_GAMEPLAY_OK' "test-results/${name}-render.txt"
          done
      - name: Existing original-image regional aliases in Main
        shell: bash
        run: |
          set -euo pipefail
          ENGINE=/tmp/Godot_v4.7.2-stable_linux.x86_64
          while read -r label script subject; do
            TWILIGHT_ORIGINAL_SUBJECT="$subject" TWILIGHT_PR100_REPORT="${PWD}/test-results/${label}-headless.json" XDG_DATA_HOME="${RUNNER_TEMP}/${label}-headless-user" timeout 300 "$ENGINE" --headless --path . --script "res://tests/${script}.gd" 2>&1 | tee "test-results/${label}-headless.txt"
            if grep -E 'SCRIPT ERROR:|ERROR:|PR100_GAMEPLAY_FAIL' "test-results/${label}-headless.txt"; then exit 1; fi
            grep -q 'PR100_DIRECTION_GAMEPLAY_OK' "test-results/${label}-headless.txt"
            TWILIGHT_ORIGINAL_SUBJECT="$subject" TWILIGHT_ORIGINAL_POSE_CAPTURE=0 TWILIGHT_PR100_CAPTURE_DIR="${RUNNER_TEMP}/original-based-aliases/${label}" TWILIGHT_PR100_REPORT="${RUNNER_TEMP}/original-based-aliases/${label}/gameplay.json" XDG_DATA_HOME="${RUNNER_TEMP}/${label}-render-user" LIBGL_ALWAYS_SOFTWARE=1 timeout 300 xvfb-run -a -s '-screen 0 1280x720x24' "$ENGINE" --rendering-driver opengl3 --audio-driver Dummy --path . --script "res://tests/${script}.gd" 2>&1 | tee "test-results/${label}-render.txt"
            if grep -E 'SCRIPT ERROR:|ERROR:|PR100_GAMEPLAY_FAIL' "test-results/${label}-render.txt"; then exit 1; fi
            grep -q 'PR100_DIRECTION_GAMEPLAY_OK' "test-results/${label}-render.txt"
          done <<'CASES'
          ghost-gludio original_based_ghost_gameplay_test 글루디오 던전 유령
          ghost-hell original_based_ghost_gameplay_test 지옥의 고스트
          ogre-giran original_based_ogre_gameplay_test 기란 평원 오우거
          ogre-ancient original_based_ogre_gameplay_test 잊혀진 섬 고대오우거
          CASES
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-presentation-${{ github.sha }}
          path: |
            test-results/
            ${{ runner.temp }}/presentation/**/animation-presentation-coverage.json
            ${{ runner.temp }}/presentation/**/boss-presentation-results.json
            ${{ runner.temp }}/presentation/**/presentation-gallery/
            ${{ runner.temp }}/presentation/**/presentation-sequences/
            ${{ runner.temp }}/presentation/**/combat-review/
            ${{ runner.temp }}/presentation/**/presentation-benchmark/
            ${{ runner.temp }}/aden-boss-special/**/aden-boss-special-results.json
            ${{ runner.temp }}/pr100-main-directions/
            ${{ runner.temp }}/original_based_monster_gameplay_test-render/
            ${{ runner.temp }}/original_based_ghost_gameplay_test-render/
            ${{ runner.temp }}/original_based_ogre_gameplay_test-render/
            ${{ runner.temp }}/original_based_reaper_gameplay_test-render/
            ${{ runner.temp }}/original-based-aliases/
          if-no-files-found: error
