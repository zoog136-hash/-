name: Animation Presentation Validate
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/animation/**'
      - 'scripts/monsters/**'
      - 'scripts/monster.gd'
      - 'scripts/player.gd'
      - 'scripts/world.gd'
      - 'data/animation_presentation.json'
      - 'data/combat_animation_profiles.json'
      - 'assets/actors/eight_direction/**'
      - 'tools/build_animation_expansion.py'
      - 'tools/build_open_sprite_sample.gd'
      - 'tools/audit_eight_direction_coverage.py'
      - 'tools/*original_based_motion*'
      - 'tools/link_original_based_identity.py'
      - 'data/animation_authoring_sources.json'
      - 'tests/original_based*'
      - 'tests/test_original_based_pose_files.py'
      - 'tests/test_original_based_direction_canvases.py'
      - 'tests/run_original_based*batch.gd'
      - 'tests/pr100_direction_gameplay_test.gd'
      - 'tests/fixtures/pr100_batch*.json'
      - 'tests/fixtures/pr100_transform*.json'
      - 'tests/fixtures/pr100_temporal*.json'
      - 'tests/*animation*'
      - 'tests/*presentation*'
      - '.github/workflows/animation-presentation-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: animation-presentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Restore trusted-main PNG import shards
        uses: ./.github/actions/restore-godot-png-cache
      - name: Restore trusted compact Godot import cache (read-only)
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .godot/imported/*.webp-*
            .godot/imported/*.svg-*
            .godot/imported/*.ttf-*
            .godot/imported/*.wav-*
            **/*.import
          key: twilight-godot-import-4.7.2-linux-compat-main-v2-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            twilight-godot-import-4.7.2-linux-compat-main-v2-
      - name: Keep tracked per-file import settings over the restored cache
        shell: bash
        # Large actor sheets commit their .import (VRAM/ETC2). The compact cache
        # restores every *.import from an older main; put tracked ones back.
        run: git ls-files -z -- '*.import' | xargs -0 -r git checkout --
      - name: Verify existing resource ledger
        run: python3 tools/check_resource_integrity.py --root .
      - name: Install pinned Godot and software GL
        run: |
          curl -L --fail --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
      - name: Import and full identity / combat regressions
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/presentation"
          ENGINE=/tmp/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p test-results
          "$ENGINE" --headless --path . --editor --quit 2>&1 | tee test-results/presentation-import.txt
          if grep -E 'SCRIPT ERROR:|ERROR:' test-results/presentation-import.txt; then grep -E 'SCRIPT ERROR:|ERROR:' test-results/presentation-import.txt | head -n 10 | sed 's/^/::error title=Godot import::/'; exit 1; fi
          python3 tests/animation_expansion_plan_test.py 2>&1 | tee test-results/animation-expansion-plan.txt
          python3 -m pip install 'Pillow==11.3.0' 'numpy==2.2.6' 'scipy==1.15.3'
          python3 tests/eight_direction_coverage_audit_test.py
          python3 tests/original_based_motion_import_test.py
          python3 tests/test_original_based_pose_files.py
          python3 tests/test_original_based_direction_canvases.py
          python3 tests/original_based_identity_link_test.py
          python3 tools/audit_eight_direction_coverage.py --root . --output-dir test-results/eight-direction-coverage
          for name in eight_direction_animation_test native_animation_expansion_test original_based_canvas_test; do
            "$ENGINE" --headless --path . --script "res://tests/${name}.gd" 2>&1 | tee "test-results/${name}.txt"
            if grep -E 'SCRIPT ERROR:|ERROR:|FAIL' "test-results/${name}.txt"; then exit 1; fi
          done
          XDG_DATA_HOME="${RUNNER_TEMP}/transform-batch-guards" "$ENGINE" --headless --path . --script res://tests/original_based_transform_batch_test.gd > test-results/transform-batch-guards.txt 2>&1
          if grep -E 'SCRIPT ERROR:|ERROR:|PR100_GAMEPLAY_FAIL' test-results/transform-batch-guards.txt; then exit 1; fi
          grep -q 'PR100_TRANSFORM_BATCH_GUARD_OK' test-results/transform-batch-guards.txt
          for name in actor_motion_test animation_presentation_test boss_presentation_test authored_state_motion_test animation_restore_test monster_attack_profiles_test combat_timing_test combat_resolution_equivalence_test volley_motion_test hit_feedback_test combat_vfx_test; do
            "$ENGINE" --headless --path . --script "res://tests/${name}.gd" 2>&1 | tee "test-results/${name}.txt"
            if grep -E 'SCRIPT ERROR:|ERROR:|FAIL:' "test-results/${name}.txt"; then exit 1; fi
            grep -q '_OK' "test-results/${name}.txt"
          done
          XDG_DATA_HOME="${RUNNER_TEMP}/aden-boss-special" "$ENGINE" --headless --path . --script res://tests/aden_boss_special_test.gd 2>&1 | tee test-results/aden-boss-special.txt
          if grep -E 'SCRIPT ERROR:|ERROR:|ADEN_BOSS_SPECIAL_FAIL' test-results/aden-boss-special.txt; then exit 1; fi
          grep -q 'ADEN_BOSS_SPECIAL_OK' test-results/aden-boss-special.txt
          "$ENGINE" --headless --path . --script res://tests/pr100_direction_gameplay_test.gd 2>&1 | tee test-results/pr100-direction-gameplay.txt
          if grep -E 'SCRIPT ERROR:|ERROR:|PR100_GAMEPLAY_FAIL' test-results/pr100-direction-gameplay.txt; then exit 1; fi
          grep -q 'PR100_DIRECTION_GAMEPLAY_OK' test-results/pr100-direction-gameplay.txt
      - name: All boss poses and real gameplay renders
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/presentation"
          export LIBGL_ALWAYS_SOFTWARE=1
          for name in capture_presentation_gallery capture_presentation_sequences capture_combat benchmark_presentation_battles; do
            args=()
            if [ "$name" = benchmark_presentation_battles ]; then args=(-- --legacy-aden-faith-layouts); fi
            xvfb-run -a -s '-screen 0 1280x720x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --audio-driver Dummy --path . --script "res://tests/${name}.gd" "${args[@]}" 2>&1 | tee "test-results/${name}.txt"
            if grep -E 'SCRIPT ERROR:|ERROR:|FAIL:|FAILED' "test-results/${name}.txt"; then exit 1; fi
          done
          export TWILIGHT_PR100_CAPTURE_DIR="${RUNNER_TEMP}/pr100-main-directions"
          export TWILIGHT_PR100_REPORT="${RUNNER_TEMP}/pr100-main-directions/gameplay.json"
          XDG_DATA_HOME="${RUNNER_TEMP}/pr100-main-user" timeout 600 xvfb-run -a -s '-screen 0 1280x720x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --audio-driver Dummy --path . --script res://tests/pr100_direction_gameplay_test.gd 2>&1 | tee test-results/pr100-main-render.txt
          if grep -E 'SCRIPT ERROR:|ERROR:|PR100_GAMEPLAY_FAIL' test-results/pr100-main-render.txt; then exit 1; fi
          grep -q 'PR100_DIRECTION_GAMEPLAY_OK' test-results/pr100-main-render.txt
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-presentation-${{ github.sha }}
          path: |
            test-results/
            ${{ runner.temp }}/presentation/**/animation-presentation-coverage.json
            ${{ runner.temp }}/presentation/**/boss-presentation-results.json
            ${{ runner.temp }}/presentation/**/presentation-gallery/
            ${{ runner.temp }}/presentation/**/presentation-sequences/
            ${{ runner.temp }}/presentation/**/combat-review/
            ${{ runner.temp }}/presentation/**/presentation-benchmark/
            ${{ runner.temp }}/aden-boss-special/**/aden-boss-special-results.json
            ${{ runner.temp }}/pr100-main-directions/
          if-no-files-found: error
  # Each job imports the project once, then runs several original-based case
  # groups. Previously every small group (2-5 cases, ~3-9 test minutes) was its
  # own job that re-did checkout (~7-10 min) and a full import (~17-28 min).
  # Every case line is unchanged; a failing case no longer hides later cases:
  # all cases run, and the job fails at the end listing every failed label.
  original-based:
    name: Original-based Main / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: monsters-1
            # ~34 test minutes: cockatrice-spear, succubus-regional, horn-cerberus, raziel-watcher-boss, penguin-pan-transform, wolf-tiger-basilisk
            cases: |
              cockatrice|original_based_cockatrice_gameplay_test||poses
              cockatrice-giran|original_based_cockatrice_gameplay_test|기란 평원 코카트리스|directions
              cockatrice-ancient|original_based_cockatrice_gameplay_test|잊혀진 섬 고대코카트리스|directions
              cockatrice-distorted|original_based_cockatrice_gameplay_test|왜곡의 코카트리스|directions
              spear-captain|original_based_spear_captain_gameplay_test||poses
              succubus-nest|original_based_succubus_gameplay_test|지룡의 둥지 지룡서큐버스|directions
              succubus-disbelief|original_based_succubus_gameplay_test|불신의 서큐버스|directions
              succubus-dark-queen|original_based_succubus_gameplay_test|암흑의 서큐버스 퀸|directions
              succubus-arrogant-queen|original_based_succubus_gameplay_test|오만한 서큐버스 퀸|directions
              horn-cerberus|original_based_horn_cerberus_gameplay_test||poses
              horn-cerberus-cruel|original_based_horn_cerberus_gameplay_test|잔혹한 혼 켈베로스|directions
              raziel-watcher|original_based_raziel_watcher_gameplay_test||poses|450
              ancient-penguin|original_based_ancient_penguin_gameplay_test||poses
              pan|original_based_pan_gameplay_test||poses
              dire-wolf|original_based_dire_wolf_gameplay_test||poses
              saber-tiger|original_based_saber_tiger_gameplay_test||poses
              saber-tiger-cruel|original_based_saber_tiger_gameplay_test|잔혹한 샤벨타이거|directions
              basilisk|original_based_basilisk_gameplay_test||poses
          - group: monsters-2
            # ~34 test minutes: werewolf-ghost, golems-cyclops, succubus-field, iron-golem-ghoul, lizard-regional, ice-man-scorpion
            cases: |
              werewolf|original_based_monster_gameplay_test||poses
              ghost|original_based_ghost_gameplay_test||poses
              ghost-gludio|original_based_ghost_gameplay_test|글루디오 던전 유령|directions
              ghost-hell|original_based_ghost_gameplay_test|지옥의 고스트|directions
              lava-golem|original_based_lava_golem_gameplay_test||poses
              ice-golem|original_based_ice_golem_gameplay_test||poses
              lava-golem-nest|original_based_lava_golem_gameplay_test|화룡의 둥지 라바 골렘|directions
              cyclops|original_based_cyclops_gameplay_test||poses
              succubus|original_based_succubus_gameplay_test||poses
              succubus-earth-queen|original_based_succubus_gameplay_test|지룡의 서큐버스 퀸|directions
              succubus-valley|original_based_succubus_gameplay_test|용의 계곡 서큐버스|directions
              iron-golem|original_based_iron_golem_gameplay_test||poses
              iron-golem-hell|original_based_iron_golem_gameplay_test|지옥의 아이언골렘|directions
              ghoul-gludio|original_based_ghoul_gameplay_test||poses
              ghoul-undying|original_based_ghoul_gameplay_test|불사의 구울|directions
              lizard|original_based_lizard_gameplay_test||poses
              lizard-albino|original_based_lizard_gameplay_test|알비노 도마뱀|directions
              ice-man|original_based_ice_man_gameplay_test||poses
              scorpion|original_based_scorpion_gameplay_test||poses
          - group: monsters-3
            # ~34 test minutes: harpy-lycanthrope, bugbear-sand-worm-reaper, frog-fire-egg, bone-dragons, king-bugbear-ettin, crab-kraken-transform
            cases: |
              harpy|original_based_harpy_gameplay_test||poses
              harpy-nest|original_based_harpy_gameplay_test|풍룡의 둥지 하피|directions
              lycanthrope|original_based_lycanthrope_gameplay_test||poses
              lycanthrope-cruel|original_based_lycanthrope_gameplay_test|잔혹한 라이칸스로프|directions
              bugbear|original_based_bugbear_gameplay_test||poses
              sand-worm|original_based_sand_worm_gameplay_test||poses
              reaper-male|original_based_reaper_male_gameplay_test||poses
              albino-frog|original_based_albino_frog_gameplay_test||poses
              albino-horned-frog|original_based_albino_frog_gameplay_test|알비노 뿔 개구리|directions
              fire-egg|original_based_fire_egg_gameplay_test||poses
              fire-egg-fear|original_based_fire_egg_gameplay_test|공포의 파이어 에그|directions
              bone-dragon|original_based_bone_dragon_gameplay_test||poses
              bone-dragon-immortal|original_based_bone_dragon_gameplay_test|불멸의 본 드래곤|directions
              bone-dragon-hell|original_based_bone_dragon_gameplay_test|지옥의 본 드래곤|directions
              king-bugbear|original_based_king_bugbear_gameplay_test||poses
              ettin|original_based_ettin_gameplay_test||poses
              albino-giant-crab|original_based_albino_giant_crab_gameplay_test||poses
              kraken-transform|original_based_kraken_transform_gameplay_test||poses
          - group: monsters-4
            # ~34 test minutes: ogre-reaper, crabman-asitagio, spear-guards, mummy-seer-bosses, salah-boss, snowman-yeti
            cases: |
              ogre|original_based_ogre_gameplay_test||poses
              reaper|original_based_reaper_gameplay_test||poses
              ogre-giran|original_based_ogre_gameplay_test|기란 평원 오우거|directions
              ogre-ancient|original_based_ogre_gameplay_test|잊혀진 섬 고대오우거|directions
              crabman|original_based_crabman_gameplay_test||poses
              crabman-eva|original_based_crabman_gameplay_test|에바 왕국 크랩맨|directions
              asitagio|original_based_asitagio_gameplay_test||poses
              asitagio-arrogant|original_based_asitagio_gameplay_test|오만한 아시타지오|directions
              spear-guard-green|original_based_spear_guard_green_gameplay_test||poses
              spear-guard|original_based_spear_guard_gameplay_test||poses
              spear-guard-red|original_based_spear_guard_red_gameplay_test||poses
              mummy-lord|original_based_mummy_lord_gameplay_test||poses|450
              seer-boss|original_based_seer_boss_gameplay_test||poses|450
              salah|original_based_salah_gameplay_test||poses|450
              snowman|original_based_snowman_gameplay_test||poses
              yeti|original_based_yeti_gameplay_test||poses
    steps:
      - uses: actions/checkout@v4
      - name: Restore trusted-main PNG import shards
        uses: ./.github/actions/restore-godot-png-cache
      - name: Restore trusted compact Godot import cache (read-only)
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .godot/imported/*.webp-*
            .godot/imported/*.svg-*
            .godot/imported/*.ttf-*
            .godot/imported/*.wav-*
            **/*.import
          key: twilight-godot-import-4.7.2-linux-compat-main-v2-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            twilight-godot-import-4.7.2-linux-compat-main-v2-
      - name: Keep tracked per-file import settings over the restored cache
        shell: bash
        # Large actor sheets commit their .import (VRAM/ETC2). The compact cache
        # restores every *.import from an older main; put tracked ones back.
        run: git ls-files -z -- '*.import' | xargs -0 -r git checkout --
      - name: Verify existing resource ledger
        run: python3 tools/check_resource_integrity.py --root .
      - name: Install pinned Godot and software GL
        run: |
          curl -L --fail --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
      - name: Import actual TWILIGHT project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          XDG_DATA_HOME="${RUNNER_TEMP}/original-import" /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee test-results/import.txt
          if grep -E 'SCRIPT ERROR:|ERROR:' test-results/import.txt; then grep -E 'SCRIPT ERROR:|ERROR:' test-results/import.txt | head -n 10 | sed 's/^/::error title=Godot import::/'; exit 1; fi
      - name: Production Main headless and rendered gameplay
        shell: bash
        env:
          ORIGINAL_CASES: ${{ matrix.cases }}
          ORIGINAL_CASE_TIMEOUT: '300'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -uo pipefail
          ENGINE=/tmp/Godot_v4.7.2-stable_linux.x86_64
          failed=()
          run_case() {
            local label="$1" script="$2" subject="$3" capture_mode="$4" case_timeout="$5"
            TWILIGHT_ORIGINAL_SUBJECT="$subject" TWILIGHT_PR100_REPORT="${PWD}/test-results/${label}-headless.json" XDG_DATA_HOME="${RUNNER_TEMP}/${label}-headless-user" timeout "$case_timeout" "$ENGINE" --headless --path . --script "res://tests/${script}.gd" < /dev/null 2>&1 | tee "test-results/${label}-headless.txt" || return 1
            if grep -E 'SCRIPT ERROR:|ERROR:|PR100_GAMEPLAY_FAIL' "test-results/${label}-headless.txt"; then return 1; fi
            grep -q 'PR100_DIRECTION_GAMEPLAY_OK' "test-results/${label}-headless.txt" || return 1
            local pose_capture=0
            if [ "$capture_mode" = poses ]; then pose_capture=1; fi
            TWILIGHT_ORIGINAL_SUBJECT="$subject" TWILIGHT_ORIGINAL_POSE_CAPTURE="$pose_capture" TWILIGHT_PR100_CAPTURE_DIR="${PWD}/test-results/${label}-render" TWILIGHT_PR100_REPORT="${PWD}/test-results/${label}-render/gameplay.json" XDG_DATA_HOME="${RUNNER_TEMP}/${label}-render-user" timeout "$case_timeout" xvfb-run -a -s '-screen 0 1280x720x24' "$ENGINE" --rendering-driver opengl3 --audio-driver Dummy --path . --script "res://tests/${script}.gd" < /dev/null 2>&1 | tee "test-results/${label}-render.txt" || return 1
            if grep -E 'SCRIPT ERROR:|ERROR:|PR100_GAMEPLAY_FAIL' "test-results/${label}-render.txt"; then return 1; fi
            grep -q 'PR100_DIRECTION_GAMEPLAY_OK' "test-results/${label}-render.txt" || return 1
          }
          ran=0
          while IFS='|' read -r label script subject capture_mode case_timeout; do
            [ -n "$label" ] || continue
            ran=$((ran + 1))
            if ! run_case "$label" "$script" "$subject" "$capture_mode" "${case_timeout:-$ORIGINAL_CASE_TIMEOUT}"; then
              failed+=("$label")
              echo "::error title=Original-based case failed::$label"
            fi
          done <<< "$ORIGINAL_CASES"
          echo "ORIGINAL_BASED_CASES_RUN=$ran FAILED=${#failed[@]}"
          [ "$ran" -gt 0 ] || { echo "No cases were configured"; exit 1; }
          if [ "${#failed[@]}" -gt 0 ]; then echo "FAILED_CASES: ${failed[*]}"; exit 1; fi
      - name: Preserve actual Main logs and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-based-${{ matrix.group }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: error
  # Same consolidation for the batch suites: one import per job, then each batch
  # runs headless and OpenGL with its own config, script, marker, timeouts and
  # isolated XDG data/cache/config directories, exactly as its own job did.
  original-batch:
    name: Original-based ${{ matrix.group }} / shared engine per mode
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: batches-1
            # ~32 test minutes: batch 17, 30, transform-regression
            batches: |
              17|res://tests/fixtures/pr100_batch17.json|run_original_based_batch|PR100_ORIGINAL_BATCH_OK|600|600
              30|res://tests/fixtures/pr100_batch30.json|run_original_based_batch|PR100_ORIGINAL_BATCH_OK|600|600
              transform-regression|res://tests/fixtures/pr100_transform_regression.json|run_original_based_transform_batch|PR100_TRANSFORM_BATCH_OK|1200|2400
          - group: batches-2
            # ~31 test minutes: batch 21, 25, 27, 29
            batches: |
              21|res://tests/fixtures/pr100_batch21_accepted.json|run_original_based_transform_batch|PR100_TRANSFORM_BATCH_OK|1200|1200
              25|res://tests/fixtures/pr100_batch25.json|run_original_based_batch|PR100_ORIGINAL_BATCH_OK|600|600
              27|res://tests/fixtures/pr100_batch27.json|run_original_based_boss_batch|PR100_ORIGINAL_BATCH_OK|1200|1200
              29|res://tests/fixtures/pr100_batch29.json|run_original_based_boss_batch|PR100_ORIGINAL_BATCH_OK|1200|1200
          - group: batches-3
            # ~32 test minutes: batch 15, 16, 19, 23, 31
            batches: |
              15|res://tests/fixtures/pr100_batch15.json|run_original_based_batch|PR100_ORIGINAL_BATCH_OK|600|600
              16|res://tests/fixtures/pr100_batch16.json|run_original_based_batch|PR100_ORIGINAL_BATCH_OK|600|600
              19|res://tests/fixtures/pr100_batch19.json|run_original_based_batch|PR100_ORIGINAL_BATCH_OK|600|600
              23|res://tests/fixtures/pr100_batch23.json|run_original_based_batch|PR100_ORIGINAL_BATCH_OK|600|600
              31|res://tests/fixtures/pr100_transform_batch31.json|original_based_transform_temporal_main_test|PR100_TRANSFORM_BATCH_OK|600|600
          - group: batches-4
            # ~34 test minutes: batch 18, 20, 24, 26, 28
            batches: |
              18|res://tests/fixtures/pr100_batch18.json|run_original_based_batch|PR100_ORIGINAL_BATCH_OK|600|600
              20|res://tests/fixtures/pr100_batch20.json|run_original_based_batch|PR100_ORIGINAL_BATCH_OK|600|600
              24|res://tests/fixtures/pr100_batch24.json|run_original_based_batch|PR100_ORIGINAL_BATCH_OK|600|600
              26|res://tests/fixtures/pr100_batch26.json|run_original_based_batch|PR100_ORIGINAL_BATCH_OK|600|600
              28|res://tests/fixtures/pr100_batch28.json|run_original_based_batch|PR100_ORIGINAL_BATCH_OK|600|600
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TWILIGHT_PR100_BATCH_ISOLATED: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Restore trusted-main PNG import shards
        uses: ./.github/actions/restore-godot-png-cache
      - name: Restore trusted compact Godot import cache (read-only)
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .godot/imported/*.webp-*
            .godot/imported/*.svg-*
            .godot/imported/*.ttf-*
            .godot/imported/*.wav-*
            **/*.import
          key: twilight-godot-import-4.7.2-linux-compat-main-v2-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            twilight-godot-import-4.7.2-linux-compat-main-v2-
      - name: Keep tracked per-file import settings over the restored cache
        shell: bash
        # Large actor sheets commit their .import (VRAM/ETC2). The compact cache
        # restores every *.import from an older main; put tracked ones back.
        run: git ls-files -z -- '*.import' | xargs -0 -r git checkout --
      - name: Verify existing resource ledger
        run: python3 tools/check_resource_integrity.py --root .
      - name: Install pinned Godot and software GL
        run: |
          curl -L --fail --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
      - name: Import actual TWILIGHT project once
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/${{ matrix.group }}-import/data
          XDG_CACHE_HOME: ${{ runner.temp }}/${{ matrix.group }}-import/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/${{ matrix.group }}-import/config
        run: |
          set -euo pipefail
          mkdir -p test-results "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME"
          timeout 5400 /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee test-results/import.txt || { status=$?; echo "::error title=Godot import::import exited $status (124 = cold import exceeded 90 minutes)"; exit $status; }
          if grep -E 'SCRIPT ERROR:|ERROR:' test-results/import.txt; then grep -E 'SCRIPT ERROR:|ERROR:' test-results/import.txt | head -n 10 | sed 's/^/::error title=Godot import::/'; exit 1; fi
      - name: Configured production Main batches, headless then OpenGL
        shell: bash
        env:
          BATCHES: ${{ matrix.batches }}
        run: |
          set -uo pipefail
          ENGINE=/tmp/Godot_v4.7.2-stable_linux.x86_64
          failed=()
          run_mode() {
            local batch="$1" mode="$2" script="$3" marker="$4" limit="$5"
            local out="test-results/batch${batch}"
            local home="${RUNNER_TEMP}/batch${batch}-${mode}"
            mkdir -p "$out" "$home/data" "$home/cache" "$home/config"
            local -a command=("$ENGINE" --headless --audio-driver Dummy --path . --script "res://tests/${script}.gd")
            local -a capture=()
            if [ "$mode" = render ]; then
              command=(xvfb-run -a -s '-screen 0 1280x720x24' "$ENGINE" --rendering-driver opengl3 --audio-driver Dummy --path . --script "res://tests/${script}.gd")
              capture=(env "TWILIGHT_PR100_BATCH_CAPTURE_DIR=${GITHUB_WORKSPACE}/${out}/render-captures")
            fi
            env XDG_DATA_HOME="$home/data" XDG_CACHE_HOME="$home/cache" XDG_CONFIG_HOME="$home/config" \
              TWILIGHT_PR100_BATCH_REPORT="${GITHUB_WORKSPACE}/${out}/${mode}.json" \
              "${capture[@]}" timeout "$limit" "${command[@]}" < /dev/null > "$out/${mode}.txt" 2>&1 || return 1
            if grep -E 'SCRIPT ERROR:|ERROR:|PR100_GAMEPLAY_FAIL' "$out/${mode}.txt"; then return 1; fi
            grep -q "$marker" "$out/${mode}.txt" || return 1
          }
          ran=0
          while IFS='|' read -r batch config script marker limit render_limit; do
            [ -n "$batch" ] || continue
            ran=$((ran + 1))
            export TWILIGHT_PR100_BATCH_CONFIG="$config"
            if ! run_mode "$batch" headless "$script" "$marker" "$limit"; then
              failed+=("batch${batch}-headless"); echo "::error title=Original-based batch failed::batch${batch} headless"
            fi
            if ! run_mode "$batch" render "$script" "$marker" "$render_limit"; then
              failed+=("batch${batch}-render"); echo "::error title=Original-based batch failed::batch${batch} render"
            fi
          done <<< "$BATCHES"
          echo "ORIGINAL_BATCHES_RUN=$ran FAILED=${#failed[@]}"
          [ "$ran" -gt 0 ] || { echo "No batches were configured"; exit 1; }
          if [ "${#failed[@]}" -gt 0 ]; then echo "FAILED_BATCHES: ${failed[*]}"; exit 1; fi
      - name: Preserve small batch diagnostics and generated saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-based-${{ matrix.group }}-${{ github.sha }}-diagnostics
          path: |
            test-results/import.txt
            test-results/batch*/*.json
            test-results/batch*/*.jsonl
            test-results/batch*/*.txt
            test-results/batch*/*.log
            test-results/batch*/*-cases/*.json
            ${{ runner.temp }}/batch*-headless/data/**/pr100-batch-preserved/
            ${{ runner.temp }}/batch*-render/data/**/pr100-batch-preserved/
            ${{ runner.temp }}/batch*-headless/data/**/pr100-transform-batch-preserved/
            ${{ runner.temp }}/batch*-render/data/**/pr100-transform-batch-preserved/
          if-no-files-found: error
      - name: Preserve every batch PNG capture separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-based-${{ matrix.group }}-${{ github.sha }}-captures
          path: test-results/batch*/render-captures/
          if-no-files-found: ignore
