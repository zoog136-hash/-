name: Equipment collection validation
on:
  push:
    branches: [feature/permanent-equipment-collections-20261015]
  pull_request:
    paths:
      - 'scripts/collections/**'
      - 'data/collections/**'
      - 'tools/collections/**'
      - 'tests/collections/**'
      - '.github/workflows/equipment-collections-validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resource integrity preflight
        run: python3 tools/check_resource_integrity.py --root .
      - name: Download pinned project engine
        run: |
          set -euo pipefail
          mkdir -p /tmp/collection-engine
          curl -L --fail --retry 3 -o /tmp/collection-engine/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
      - name: Preserve engine for isolated tests
        uses: actions/upload-artifact@v4
        with:
          name: equipment-collection-test-engine
          retention-days: 1
          path: /tmp/collection-engine/godot.zip
      - name: Validate collections when installed
        run: |
          if test -f tools/collections/build_equipment_collections.py; then
            python3 tools/collections/build_equipment_collections.py --root . --check
            python3 -m unittest discover -s tests/collections -v
          else
            echo 'Source inspection baseline; runtime collection changes not yet installed.'
          fi
