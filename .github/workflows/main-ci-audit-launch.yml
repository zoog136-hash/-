name: Main full CI launcher (NOT validation success)

on:
  push:
    branches: [validation/main-ci-audit-20261021]
    paths:
      - .github/workflows/main-ci-audit-launch.yml
      - tools/ci/main_ci_audit.py
      - tools/ci/main_ci_audit_test.py
      - tools/ci/main_ci_safe_audit.py
      - tools/ci/main_ci_safe_audit_test.py

permissions:
  contents: read
  actions: write

concurrency:
  group: main-ci-audit-launch-4820face-20261022
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'zoog136-hash/-' && github.ref == 'refs/heads/validation/main-ci-audit-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit harness only
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact main after CI-only settings repair
        uses: actions/checkout@v4
        with:
          ref: 4820face7a51f58a17004642f24dabe4424627a0
          path: baseline
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.2
      - name: Test inventory, fail-closed verdicts and publisher exclusion
        run: |
          python3 harness/tools/ci/main_ci_audit_test.py
          python3 harness/tools/ci/main_ci_safe_audit_test.py
      - name: Dispatch every main validation without resource-publishing jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 harness/tools/ci/main_ci_safe_audit.py dispatch
          --root baseline
          --sha 4820face7a51f58a17004642f24dabe4424627a0
          --report audit-results/main-ci-audit.json
      - name: Preserve coverage, exclusions and pending/failure states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-ci-audit-4820face-${{ github.run_id }}
          path: audit-results/
          if-no-files-found: error
