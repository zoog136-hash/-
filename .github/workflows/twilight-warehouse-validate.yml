name: TWILIGHT Warehouse Persistence

on:
  push:
    branches:
      - feature/twilight-warehouse-persistent-instances-20261010
  pull_request:
    branches:
      - main
      - feature/twilight-shop-authoritative-transactions-20261010
  workflow_dispatch:

jobs:
  local-warehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse scripts
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee warehouse-import.log
          ! grep -E 'SCRIPT ERROR:|ERROR:|Parse Error:' warehouse-import.log
      - name: Warehouse state, NPC and enhanced instance regression
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/warehouse_persistence_test.gd 2>&1 | tee warehouse-test.log
          ! grep -E 'SCRIPT ERROR:|ERROR:|FAIL:' warehouse-test.log
          grep -q WAREHOUSE_OK warehouse-test.log
      - name: Original shop purchase authority regression
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/shop_authority_test.gd 2>&1 | tee -a warehouse-test.log
          grep -q SHOP_AUTHORITY_OK warehouse-test.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twilight-warehouse-evidence
          path: |
            warehouse-import.log
            warehouse-test.log
