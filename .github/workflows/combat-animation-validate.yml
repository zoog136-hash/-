name: Combat Animation Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: combat-animation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # PR122 run 39142875145 passed all applicable regressions, then reached
    # the 75m cap during region rendering. Preserve every render, frozen
    # baseline and combat benchmark; allow the same 120m as integration.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install engine and virtual GL
        run: |
          curl -L --fail --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
      # Read-only main import cache: keep all real imports, tests and render checks.
      - name: Restore trusted Godot imported resources
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.number != 157 && github.event.pull_request.number != 158) }}
        id: trusted-import-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .godot/imported/*.webp-*
            .godot/imported/*.svg-*
            .godot/imported/*.ttf-*
            .godot/imported/*.wav-*
            **/*.import
          key: twilight-godot-import-4.7.2-linux-compat-main-v2-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            twilight-godot-import-4.7.2-linux-compat-main-v2-
      - name: Combat animation and timing regressions
        # Integration keeps the full suite on these PR bases; other events remain full.
        env:
          TWILIGHT_CI_TESTS: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'integration/twilight-complete-20261009') && 'import,bake_navigation,boot,actor_motion_test,animation_catalog_test,animation_presentation_test,animation_restore_test,authored_state_motion_test,boss_presentation_test,combat_hud_test,combat_resolution_equivalence_test,combat_timeline_lifecycle_test,combat_timing_test,combat_vfx_test,eight_direction_animation_test,hit_feedback_render_test,hit_feedback_test,monster_motion_test,native_animation_expansion_test' || '' }}
        run: python3 tools/test_project.py --godot /tmp/Godot_v4.7.2-stable_linux.x86_64 --import-timeout 1500 --logs test-results --only "$TWILIGHT_CI_TESTS"
      - name: Actual combat rendering and live AUTO
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/combat-render"
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1280x720x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path . --script res://tests/capture_combat.gd 2>&1 | tee test-results/combat-render.log
          if grep -E 'SCRIPT ERROR:|ERROR:' test-results/combat-render.log; then exit 1; fi
          grep -q COMBAT_RENDER test-results/combat-render.log
      - name: Existing region render and active-play comparison
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/region-render"
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1280x720x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path . --script res://tests/capture_regions.gd -- --legacy-map-layouts 2>&1 | tee test-results/region-render.log
          if grep -E 'SCRIPT ERROR:|ERROR:' test-results/region-render.log; then exit 1; fi
      - name: Actual 32/96/192 monster crowd combat
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/crowd-render"
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1280x720x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path . --script res://tests/capture_combat_crowd.gd -- --legacy-aden-faith-layouts 2>&1 | tee test-results/crowd-render.log
          if grep -E 'SCRIPT ERROR:|ERROR:' test-results/crowd-render.log; then exit 1; fi
          grep -q COMBAT_CROWD_RENDER_OK test-results/crowd-render.log
      - name: Checkout original map-complete main for comparison
        uses: actions/checkout@v4
        with:
          ref: 11894be09077f9f3c14c2d3814aec422b8e7c2c0
          path: baseline
      - name: Original main render and active-play benchmark
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/baseline-render"
          export LIBGL_ALWAYS_SOFTWARE=1
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path baseline --editor --quit 2>&1 | tee test-results/baseline-import.log
          xvfb-run -a -s '-screen 0 1280x720x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path baseline --script res://tests/capture_regions.gd 2>&1 | tee test-results/baseline-render.log
          if grep -E 'SCRIPT ERROR:|ERROR:' test-results/baseline-render.log; then exit 1; fi
      - name: Identical CPU and crowd benchmark against starting main
        shell: bash
        run: |
          set -o pipefail
          # Capture script imports the class-confirmation QA helper. Include it in
          # the baseline checkout so both candidates run identical test code.
          cp tests/benchmark_actor_motion.gd tests/capture_combat_crowd.gd tests/qa_class_selection.gd baseline/tests/
          # The source-A3 helper in the candidate requires RemakePlayableField,
          # which did not exist in the frozen original baseline. Retain the
          # identical CPU/crowd gameplay harness while supplying baseline's
          # own validated native-geometry locations, not A3-only APIs.
          cp tests/qa_baseline_combat_positions.gd baseline/tests/
          python3 - <<'PY'
          from pathlib import Path
          script = Path('baseline/tests/capture_combat_crowd.gd')
          source = script.read_text()
          assert 'res://tests/qa_aden_source_combat_positions.gd' in source
          assert 'world.field_map as RemakePlayableField' in source
          source = source.replace('res://tests/qa_aden_source_combat_positions.gd', 'res://tests/qa_baseline_combat_positions.gd')
          source = source.replace('world.field_map as RemakePlayableField', 'world.field_map as PlayableField')
          script.write_text(source)
          PY
          export LIBGL_ALWAYS_SOFTWARE=1
          TWILIGHT_MOTION_BENCHMARK="$PWD/test-results/motion-baseline.json" /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path baseline --script res://tests/benchmark_actor_motion.gd 2>&1 | tee test-results/motion-baseline.log
          TWILIGHT_MOTION_BENCHMARK="$PWD/test-results/motion-followup.json" /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/benchmark_actor_motion.gd 2>&1 | tee test-results/motion-followup.log
          export XDG_DATA_HOME="${RUNNER_TEMP}/baseline-crowd-render"
          xvfb-run -a -s '-screen 0 1280x720x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path baseline --script res://tests/capture_combat_crowd.gd 2>&1 | tee test-results/baseline-crowd-render.log
          if grep -E 'SCRIPT ERROR:|ERROR:' test-results/motion-baseline.log test-results/motion-followup.log test-results/baseline-crowd-render.log; then exit 1; fi
          grep -q COMBAT_CROWD_RENDER_OK test-results/baseline-crowd-render.log
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-animation-review-${{ github.sha }}
          path: |
            test-results/
            ${{ runner.temp }}/combat-render/**/combat-review/
            ${{ runner.temp }}/region-render/**/world-regions-review/
            ${{ runner.temp }}/baseline-render/**/world-regions-review/
            ${{ runner.temp }}/crowd-render/**/combat-crowd-review/
            ${{ runner.temp }}/baseline-crowd-render/**/combat-crowd-review/
          if-no-files-found: error
