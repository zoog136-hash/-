name: Combat Animation Validate

on:
  push:
    branches: ['feature/combat-animation-overhaul']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: combat-animation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install engine and virtual GL
        run: |
          curl -L --fail --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
      - name: All headless regressions
        run: python3 tools/test_project.py --godot /tmp/Godot_v4.7.2-stable_linux.x86_64 --logs test-results
      - name: Actual combat rendering and live AUTO
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/combat-render"
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1280x720x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path . --script res://tests/capture_combat.gd 2>&1 | tee test-results/combat-render.log
          if grep -E 'SCRIPT ERROR:|ERROR:' test-results/combat-render.log; then exit 1; fi
          grep -q COMBAT_RENDER test-results/combat-render.log
      - name: Existing region render and active-play comparison
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/region-render"
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1280x720x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path . --script res://tests/capture_regions.gd 2>&1 | tee test-results/region-render.log
          if grep -E 'SCRIPT ERROR:|ERROR:' test-results/region-render.log; then exit 1; fi
      - name: Checkout original map-complete main for comparison
        uses: actions/checkout@v4
        with:
          ref: da5141bb91c0d852a0d8d175d54bb8b369e76a5d
          path: baseline
      - name: Original main render and active-play benchmark
        shell: bash
        run: |
          set -o pipefail
          export XDG_DATA_HOME="${RUNNER_TEMP}/baseline-render"
          export LIBGL_ALWAYS_SOFTWARE=1
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path baseline --editor --quit 2>&1 | tee test-results/baseline-import.log
          xvfb-run -a -s '-screen 0 1280x720x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path baseline --script res://tests/capture_regions.gd 2>&1 | tee test-results/baseline-render.log
          if grep -E 'SCRIPT ERROR:|ERROR:' test-results/baseline-render.log; then exit 1; fi
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-animation-review-${{ github.sha }}
          path: |
            test-results/
            ${{ runner.temp }}/combat-render/**/combat-review/
            ${{ runner.temp }}/region-render/**/world-regions-review/
            ${{ runner.temp }}/baseline-render/**/world-regions-review/
          if-no-files-found: error
