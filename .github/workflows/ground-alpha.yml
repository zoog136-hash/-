name: Ground Alpha Repair
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ground-alpha.yml'
      - 'tools/ground_alpha/**'
      - 'tools/ground_icons/**'
      - 'tools/test_project_support.py'
      - 'scripts/ui/ground_alpha.gd'
      - 'scripts/loot/**'
      - 'assets/ground_alpha/**'
      - 'assets/ground_categories/**'
      - 'assets/l1j/verified/ground/**'
      - 'assets/original_items/ground/**'
      - 'data/ground_alpha.json'
      - 'data/ground_item_icons.json'
      - 'tests/ground_alpha_test.gd'
      - 'tests/capture_ground_alpha.gd'
      - 'tests/ground_capture*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ground-alpha.yml'
      - 'tools/ground_alpha/**'
      - 'tools/ground_icons/**'
      - 'tools/test_project_support.py'
      - 'scripts/ui/ground_alpha.gd'
      - 'scripts/loot/**'
      - 'assets/ground_alpha/**'
      - 'assets/ground_categories/**'
      - 'data/ground_alpha.json'
      - 'data/ground_item_icons.json'
      - 'tests/ground_alpha_test.gd'
      - 'tests/capture_ground_alpha.gd'
      - 'tests/ground_capture*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ground-alpha-${{ github.ref }}
  cancel-in-progress: true
jobs:
  alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Restore trusted compact Godot import cache (read-only)
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .godot/imported/*.webp-*
            .godot/imported/*.svg-*
            .godot/imported/*.ttf-*
            .godot/imported/*.wav-*
            **/*.import
          key: twilight-godot-import-4.7.2-linux-compat-main-v2-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            twilight-godot-import-4.7.2-linux-compat-main-v2-
      - name: Validate committed alpha-only assets offline
        run: |
          python3 -m pip install Pillow==12.3.0
          python3 tools/ground_alpha/test_alpha.py
          python3 tools/ground_alpha/test_verify_runner.py
          python3 tools/ground_icons/build.py
          python3 tools/ground_alpha/bake.py
      - name: Install repository-pinned renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          curl --fail --location --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -qo /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Test actual Main alpha, inventory, names, effects and pickup
        run: python3 tools/ground_alpha/verify.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --output /tmp/ground-alpha --import-timeout 1800
      - name: Verification is read-only for tracked game files
        run: git diff --exit-code -- scripts data assets tools tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ground-alpha-validation-${{ github.sha }}
          path: |
            /tmp/ground-alpha/*.json
            /tmp/ground-alpha/*.log
            /tmp/ground-alpha/*.png
            /tmp/ground-alpha/after-captures/
          retention-days: 14
          if-no-files-found: error
