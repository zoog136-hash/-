name: Ground Alpha Repair
on:
  push:
    branches: [fix/ground-alpha-20261015]
    paths: ['.github/workflows/ground-alpha.yml', 'tools/ground_alpha/**', 'tools/ground_icons/alpha.py', 'scripts/ui/ground_alpha.gd', 'tests/ground_alpha_test.gd', 'tests/capture_ground_alpha.gd']
permissions:
  contents: read
concurrency:
  group: ground-alpha-${{ github.ref }}
  cancel-in-progress: true
jobs:
  alpha:
    if: github.ref == 'refs/heads/fix/ground-alpha-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Install repository-pinned test tools
        run: |
          python3 -m pip install Pillow==12.3.0
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          curl --fail --location --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -qo /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Reproduce, remove white matte, verify real Main and unchanged inventory/effects
        run: python3 tools/ground_alpha/verify.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --output /tmp/ground-alpha --install
      - name: Publish only tested floor-display changes on the feature branch
        run: |
          test "$GITHUB_REF" = refs/heads/fix/ground-alpha-20261015
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code -- scripts/world.gd scripts/player.gd scripts/ui/item_visual_resolver.gd data/catalog_v19.json data/game_db_v17.json data/inven_inventory_icons.json assets/catalog assets/inven_inventory assets/original_items assets/l1j
          python3 tools/ground_icons/build.py
          python3 tools/ground_alpha/bake.py
          mkdir -p docs/verification/ground_alpha_20261015
          cp /tmp/ground-alpha/preservation.json /tmp/ground-alpha/test-summary.json /tmp/ground-alpha/alpha-result.json docs/verification/ground_alpha_20261015/
          cp /tmp/ground-alpha/before-all-icons.png /tmp/ground-alpha/after-all-icons.png docs/verification/ground_alpha_20261015/
          cp /tmp/ground-alpha/before-captures/white-backgrounds.png docs/verification/ground_alpha_20261015/Main-before.png
          cp /tmp/ground-alpha/after-captures/white-backgrounds.png docs/verification/ground_alpha_20261015/Main-after.png
          git add -- tools/ground_icons/build.py scripts/loot/drop_visual.gd data/ground_item_icons.json data/ground_alpha.json assets/ground_categories assets/ground_alpha docs/verification/ground_alpha_20261015
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove white matte from category and dedicated floor icons; preserve original pixels, inventory and grade effects'
            git push origin HEAD:refs/heads/fix/ground-alpha-20261015
          fi
          git rev-parse HEAD > /tmp/ground-alpha/verified-commit.txt
      - name: Package proof and floor-only patch
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          out=Path('/tmp/ground-alpha');out.mkdir(exist_ok=True)
          names=['tools/ground_icons/build.py','tools/ground_icons/alpha.py','scripts/ui/ground_alpha.gd','scripts/loot/drop_visual.gd','tests/ground_alpha_test.gd','tests/capture_ground_alpha.gd','data/ground_item_icons.json','data/ground_alpha.json']
          for folder in ['tools/ground_alpha','assets/ground_categories','assets/ground_alpha','docs/verification/ground_alpha_20261015']:
              names.extend(str(p) for p in Path(folder).rglob('*') if p.is_file() and p.suffix!='.import' and '__pycache__' not in str(p))
          with zipfile.ZipFile(out/'ground-alpha-patch.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  if Path(name).is_file():z.write(name,name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ground-alpha-verification
          path: |
            /tmp/ground-alpha/*.json
            /tmp/ground-alpha/*.log
            /tmp/ground-alpha/*.txt
            /tmp/ground-alpha/*.png
            /tmp/ground-alpha/*.zip
            /tmp/ground-alpha/*-captures/
          retention-days: 14
          if-no-files-found: error
