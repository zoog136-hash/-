name: Map pack upload once
on:
  push:
    branches: [feature/twilight-map-original-packs-20261020]
    paths: [.github/workflows/map-pack-upload-once.yml]
permissions:
  contents: write
concurrency:
  group: twilight-pr133-map-asset-transfer
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 'zoog136-hash/-' && github.ref == 'refs/heads/feature/twilight-map-original-packs-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          sparse-checkout: |
            external_map_packs
            tools/map_restore
          persist-credentials: true
      - name: Guard target branch and original head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/feature/twilight-map-original-packs-20261020"
      - name: Download pinned sources and verify every map file
        env:
          TRANSFER_COMMENT_ID: '6283008232'
        run: python3 tools/map_restore/ship_maps_once.py
      - name: Commit only verified assets and push without force
        shell: bash
        run: |
          set -euo pipefail
          git add -- external_map_packs/native_png_v5 external_map_packs/oman_v2 external_map_packs/.gdignore external_map_packs/.gitattributes external_map_packs/MAP_ASSET_DELIVERY.json
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          assert all(not p or p.startswith('external_map_packs/') for p in paths), 'Unexpected staged path'
          print('Staged verified asset files:',len([p for p in paths if p]))
          PY
          if git diff --cached --quiet; then
            echo "All assets already present; no new commit"
            exit 0
          fi
          remote=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets(maps): ship verified native PNG v5 and Oman v2 files [skip ci]' > /tmp/map-asset-commit.log
          git push origin "HEAD:$GITHUB_REF"
          echo "Uploaded asset commit: $(git rev-parse HEAD)"
          echo "## Map assets uploaded" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse HEAD). Native v5 210 files + Oman v2 15 files. Main and all other branches unchanged. Runtime auto-activation and Android testing are separate." >> "$GITHUB_STEP_SUMMARY"
