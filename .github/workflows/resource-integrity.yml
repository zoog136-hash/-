name: TWILIGHT resource integrity (no old-pack resources)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Manual audits stay independent; newer automatic revisions release old runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  resource-integrity:
    # Required check name kept. The game shows only the original 523 resource
    # pack (installed separately); older art must not come back as a substitute.
    name: Verify committed assets, manifest SHA, and delivery status
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/check_no_legacy_resources.py
            /tests/test_no_legacy_resources.py
      - name: No pre-November resources are committed
        run: python3 tools/check_no_legacy_resources.py --root .
      - name: The check rejects old art
        run: python3 -m unittest discover -s tests -p 'test_no_legacy_resources.py' -v
