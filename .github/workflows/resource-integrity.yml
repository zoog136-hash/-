name: TWILIGHT resource integrity (no silent missing assets)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Manual audits stay independent; newer automatic revisions release old runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  resource-integrity:
    name: Verify committed assets, manifest SHA, and delivery status
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Only the 723 runtime atlases, their source images and skill icon
      # receipts are required here. Sparse checkout preserves the complete
      # Git index so uncommitted/missing assets still fail closed.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/catalog_motion/**
            /assets/catalog/**
            /assets/directional/**
            /assets/skills/styled_icons/**
            /data/visuals/runtime_manifest.json
            /data/resource_delivery_ledger.json
            /data/skills/styled_icon_provenance.json
            /data/skills/master.json
            /tools/check_resource_integrity.py
            /tools/skills/verify_styled_skill_icons.py
            /tests/test_resource_integrity.py
      - name: Confirm all source families are materialized by sparse checkout
        run: |
          test -f data/visuals/runtime_manifest.json
          test -f data/resource_delivery_ledger.json
          test -f data/skills/styled_icon_provenance.json
          test -d assets/catalog_motion
          test -d assets/catalog
          test -d assets/directional
          test -d assets/skills/styled_icons
      - name: Check all 723 real atlases and distinguish unshipped original packs
        run: python3 tools/check_resource_integrity.py --root .
      - name: Verify all licensed skill images and source attribution
        run: python3 tools/skills/verify_styled_skill_icons.py
      - name: Test that missing or uncommitted art fails closed
        run: python3 -m unittest discover -s tests -p 'test_resource_integrity.py' -v
