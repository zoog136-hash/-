name: TWILIGHT resource integrity (no silent missing assets)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-integrity:
    name: Verify committed assets, manifest SHA, and delivery status
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check all 723 real atlases and distinguish unshipped original packs
        run: python3 tools/check_resource_integrity.py --root .
      - name: Test that missing or uncommitted art fails closed
        run: python3 -m unittest discover -s tests -p 'test_resource_integrity.py' -v
